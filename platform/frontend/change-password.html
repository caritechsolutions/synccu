<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SyncCU - Change Password">
  <meta name="theme-color" content="#1a56db">
  <title>SyncCU - Change Password</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      background: #0f172a;
      overflow: hidden;
    }

    .login-page::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 50%, rgba(26, 86, 219, 0.3) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 50%, rgba(124, 58, 237, 0.2) 0%, transparent 50%);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.1) rotate(3deg); }
    }

    .login-card {
      background: #ffffff;
      border-radius: 1.25rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 440px;
      padding: 3rem 2.5rem;
      position: relative;
      z-index: 1;
    }

    [data-theme="dark"] .login-card {
      background: #1e293b;
      border: 1px solid #334155;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.35);
    }

    .login-logo svg {
      width: 32px;
      height: 32px;
      color: white;
    }

    .login-title {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.03em;
      margin: 0 0 0.25rem;
    }

    [data-theme="dark"] .login-title { color: #f1f5f9; }

    .login-subtitle {
      text-align: center;
      color: #64748b;
      font-size: 0.9375rem;
      margin-bottom: 2rem;
    }

    [data-theme="dark"] .login-subtitle { color: #94a3b8; }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    [data-theme="dark"] .form-group label { color: #cbd5e1; }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.8125rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 0.625rem;
      font-size: 0.9375rem;
      font-family: inherit;
      background: #f8fafc;
      color: #0f172a;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      box-sizing: border-box;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: #1a56db;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(26, 86, 219, 0.12);
    }

    .input-wrapper input::placeholder { color: #94a3b8; }

    [data-theme="dark"] .input-wrapper input {
      background: #0f172a;
      border-color: #475569;
      color: #f1f5f9;
    }

    [data-theme="dark"] .input-wrapper input:focus {
      border-color: #60a5fa;
      background: #0f172a;
      box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 0.875rem 1rem;
      background: linear-gradient(135deg, #1a56db, #1e40af);
      color: #ffffff;
      border: none;
      border-radius: 0.625rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(26, 86, 219, 0.35);
      letter-spacing: 0.01em;
      margin-top: 0.5rem;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #1e40af, #1e3a8a);
      box-shadow: 0 6px 20px rgba(26, 86, 219, 0.45);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(26, 86, 219, 0.3);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-login .spinner-sm {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .login-error {
      background: #fef2f2;
      color: #b91c1c;
      padding: 0.75rem 1rem;
      border-radius: 0.625rem;
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid #fecaca;
    }

    [data-theme="dark"] .login-error {
      background: #450a0a;
      color: #fca5a5;
      border-color: #7f1d1d;
    }

    .login-error.visible { display: flex; }

    .login-success {
      background: #f0fdf4;
      color: #166534;
      padding: 0.75rem 1rem;
      border-radius: 0.625rem;
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid #bbf7d0;
    }

    [data-theme="dark"] .login-success {
      background: #052e16;
      color: #86efac;
      border-color: #166534;
    }

    .login-success.visible { display: flex; }

    .login-footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e2e8f0;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    [data-theme="dark"] .login-footer { border-top-color: #334155; }

    .notice-banner {
      background: #fffbeb;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 0.625rem;
      padding: 0.75rem 1rem;
      font-size: 0.8125rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    [data-theme="dark"] .notice-banner {
      background: #451a03;
      color: #fbbf24;
      border-color: #92400e;
    }

    .pw-requirements {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.25rem;
    }

    [data-theme="dark"] .pw-requirements { color: #94a3b8; }

    .theme-toggle-corner {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 10;
    }

    .theme-toggle-corner button {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .theme-toggle-corner button:hover { background: rgba(255, 255, 255, 0.2); }

    .theme-toggle-corner svg { width: 1.25rem; height: 1.25rem; }

    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.5rem; }
      .login-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="icon-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </symbol>
  </svg>

  <div class="login-page">
    <div class="theme-toggle-corner">
      <button type="button" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun"><use href="#icon-sun"/></svg>
        <svg class="icon-moon" style="display:none"><use href="#icon-moon"/></svg>
      </button>
    </div>

    <div class="login-card">
      <div class="login-logo">
        <svg><use href="#icon-key"/></svg>
      </div>

      <h1 class="login-title">Change Password</h1>
      <p class="login-subtitle">Your administrator requires you to set a new password</p>

      <div class="notice-banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>You must change your password before continuing.</span>
      </div>

      <div id="changeError" class="login-error">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span id="changeErrorMsg"></span>
      </div>

      <div id="changeSuccess" class="login-success">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span id="changeSuccessMsg"></span>
      </div>

      <form id="change-password-form" novalidate>
        <div class="form-group">
          <label for="currentPassword">Current Password</label>
          <div class="input-wrapper">
            <input type="password" id="currentPassword" placeholder="Enter your current password" required>
          </div>
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="input-wrapper">
            <input type="password" id="newPassword" placeholder="Enter new password" required>
          </div>
          <p class="pw-requirements">Minimum 8 characters</p>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
          </div>
        </div>

        <button type="submit" class="btn-login" id="changeBtn">Change Password</button>
      </form>

      <div class="login-footer">
        &copy; 2026 SyncCU. Secure banking platform.
      </div>
    </div>
  </div>

  <script>
    (function() {
      const toggle = document.getElementById('themeToggle');
      const saved = localStorage.getItem('synccu-theme');
      if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        toggle.querySelector('.icon-sun').style.display = 'none';
        toggle.querySelector('.icon-moon').style.display = '';
      }
      toggle.addEventListener('click', function() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
        localStorage.setItem('synccu-theme', isDark ? 'light' : 'dark');
        toggle.querySelector('.icon-sun').style.display = isDark ? '' : 'none';
        toggle.querySelector('.icon-moon').style.display = isDark ? 'none' : '';
      });
    })();

    (function() {
      var token = localStorage.getItem('synccu-token');
      if (!token) {
        window.location.href = '/index.html';
        return;
      }

      var form = document.getElementById('change-password-form');
      var errorBox = document.getElementById('changeError');
      var errorMsg = document.getElementById('changeErrorMsg');
      var successBox = document.getElementById('changeSuccess');
      var successMsg = document.getElementById('changeSuccessMsg');
      var btn = document.getElementById('changeBtn');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorBox.classList.add('visible');
        successBox.classList.remove('visible');
      }

      function showSuccess(msg) {
        successMsg.textContent = msg;
        successBox.classList.add('visible');
        errorBox.classList.remove('visible');
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errorBox.classList.remove('visible');
        successBox.classList.remove('visible');

        var currentPassword = document.getElementById('currentPassword').value;
        var newPassword = document.getElementById('newPassword').value;
        var confirmPassword = document.getElementById('confirmPassword').value;

        if (!currentPassword || !newPassword || !confirmPassword) {
          showError('All fields are required.');
          return;
        }

        if (newPassword.length < 8) {
          showError('New password must be at least 8 characters.');
          return;
        }

        if (newPassword !== confirmPassword) {
          showError('New passwords do not match.');
          return;
        }

        if (currentPassword === newPassword) {
          showError('New password must be different from current password.');
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-sm"></span> Changing...';

        try {
          var res = await fetch('/api/v1/auth/change-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token,
            },
            body: JSON.stringify({
              current_password: currentPassword,
              new_password: newPassword,
            }),
          });

          var data = await res.json();

          if (!res.ok || data.error) {
            showError(data.message || data.error || 'Failed to change password.');
            btn.disabled = false;
            btn.textContent = 'Change Password';
            return;
          }

          showSuccess('Password changed successfully. Redirecting to login...');
          localStorage.removeItem('synccu-token');
          localStorage.removeItem('synccu-refresh');
          localStorage.removeItem('synccu-user');

          setTimeout(function() {
            window.location.href = '/index.html';
          }, 2000);
        } catch (err) {
          showError('Connection error. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Change Password';
        }
      });
    })();
  </script>
</body>
</html>

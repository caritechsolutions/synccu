<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SyncCU - Transfer Money">
    <title>Transfer - SyncCU</title>
    <link rel="stylesheet" href="../css/app.css">
    <script>if (!localStorage.getItem('synccu-token')) { window.location.href = '../index.html'; }</script>
</head>
<body class="portal-body">

<!-- SVG Icon Sprite -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="icon-logo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-wallet" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-1M3 7a2 2 0 012-2h12a2 2 0 012 2M3 7h16m-3 4h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-transfer" viewBox="0 0 24 24"><path d="M8 7h12l-4-4M16 17H4l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-loan" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 00-5-5.917V4a1 1 0 10-2 0v1.083A6 6 0 006 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-check-circle" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M22 4L12 14.01l-3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5m0 0l7 7m-7-7l7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<!-- Top Navigation Bar -->
<nav class="portal-nav">
    <div class="portal-nav-inner">
        <div class="portal-nav-left">
            <button class="portal-mobile-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                <svg class="icon icon-md"><use href="#icon-menu"/></svg>
            </button>
            <a href="dashboard.html" class="portal-logo">
                <svg class="icon icon-lg"><use href="#icon-logo"/></svg>
                <span class="portal-logo-text">SyncCU</span>
            </a>
            <div class="portal-nav-links" id="navLinks">
                <a href="dashboard.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-home"/></svg> Dashboard
                </a>
                <a href="accounts.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-wallet"/></svg> Accounts
                </a>
                <a href="transfer.html" class="portal-nav-link active">
                    <svg class="icon icon-sm"><use href="#icon-transfer"/></svg> Transfer
                </a>
                <a href="loans.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-loan"/></svg> Loans
                </a>
            </div>
        </div>
        <div class="portal-nav-right">
            <button class="portal-nav-icon-btn theme-toggle" aria-label="Toggle theme">
                <svg class="icon icon-sm theme-icon-light"><use href="#icon-moon"/></svg>
                <svg class="icon icon-sm theme-icon-dark"><use href="#icon-sun"/></svg>
            </button>
            <button class="portal-nav-icon-btn portal-notification-btn" aria-label="Notifications">
                <svg class="icon icon-sm"><use href="#icon-bell"/></svg>
            </button>
            <div class="portal-user-menu" id="userMenu">
                <button class="portal-user-trigger" id="userMenuTrigger">
                    <span class="portal-avatar" id="userAvatar">--</span>
                    <span class="portal-user-name" id="userName">Member</span>
                    <svg class="icon icon-xs"><use href="#icon-chevron-down"/></svg>
                </button>
                <div class="portal-user-dropdown" id="userDropdown">
                    <a href="profile.html" class="portal-dropdown-item">
                        <svg class="icon icon-sm"><use href="#icon-user"/></svg> Profile
                    </a>
                    <a href="profile.html#security" class="portal-dropdown-item">
                        <svg class="icon icon-sm"><use href="#icon-settings"/></svg> Settings
                    </a>
                    <hr class="portal-dropdown-divider">
                    <button class="portal-dropdown-item portal-dropdown-logout" id="logoutBtn">
                        <svg class="icon icon-sm"><use href="#icon-logout"/></svg> Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="portal-main">
    <div class="portal-container portal-container--narrow">

        <h1 class="portal-page-title portal-page-title--center">Transfer Money</h1>

        <!-- Step Indicator -->
        <div class="portal-steps">
            <div class="portal-step portal-step--active" data-step="1">
                <span class="portal-step-number">1</span>
                <span class="portal-step-label">Details</span>
            </div>
            <div class="portal-step-line"></div>
            <div class="portal-step" data-step="2">
                <span class="portal-step-number">2</span>
                <span class="portal-step-label">Review</span>
            </div>
            <div class="portal-step-line"></div>
            <div class="portal-step" data-step="3">
                <span class="portal-step-number">3</span>
                <span class="portal-step-label">Confirmation</span>
            </div>
        </div>

        <!-- Step 1: Details -->
        <div class="portal-transfer-step" id="step1">
            <div class="portal-card">
                <div class="portal-card-body">
                    <div class="form-group">
                        <label class="form-label" for="fromAccount">From Account</label>
                        <select class="form-input" id="fromAccount" required>
                            <option value="">Select account...</option>
                        </select>
                        <span class="form-error"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Transfer To</label>
                        <div class="portal-toggle-group">
                            <button class="portal-toggle-btn portal-toggle-btn--active" id="toggleOwn" type="button">Own Account</button>
                            <button class="portal-toggle-btn" id="toggleOther" type="button">Other Member</button>
                        </div>
                    </div>

                    <div class="form-group" id="toOwnGroup">
                        <label class="form-label" for="toOwnAccount">To Account</label>
                        <select class="form-input" id="toOwnAccount">
                            <option value="">Select account...</option>
                        </select>
                        <span class="form-error"></span>
                    </div>

                    <div class="form-group" id="toOtherGroup" style="display:none">
                        <label class="form-label" for="toOtherAccount">Recipient Account Number</label>
                        <input type="text" class="form-input" id="toOtherAccount" placeholder="Enter account number" maxlength="20">
                        <span class="form-error"></span>
                    </div>

                    <div class="form-group portal-amount-group">
                        <label class="form-label" for="transferAmount">Amount</label>
                        <div class="portal-amount-input">
                            <span class="portal-amount-currency">$</span>
                            <input type="number" class="form-input portal-amount-field" id="transferAmount" placeholder="0.00" min="0.01" step="0.01" required>
                        </div>
                        <span class="form-error"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="transferMemo">Description / Memo</label>
                        <input type="text" class="form-input" id="transferMemo" placeholder="What is this transfer for?" maxlength="200">
                    </div>

                    <button class="btn btn-primary btn-lg btn-block" id="continueToReview">Continue</button>
                </div>
            </div>
        </div>

        <!-- Step 2: Review -->
        <div class="portal-transfer-step" id="step2" style="display:none">
            <div class="portal-card">
                <div class="portal-card-body">
                    <h3 class="portal-review-title">Review Transfer</h3>

                    <div class="portal-review-summary">
                        <div class="portal-review-row">
                            <span class="portal-review-label">From</span>
                            <span class="portal-review-value" id="reviewFrom">--</span>
                        </div>
                        <div class="portal-review-row">
                            <span class="portal-review-label">To</span>
                            <span class="portal-review-value" id="reviewTo">--</span>
                        </div>
                        <div class="portal-review-divider"></div>
                        <div class="portal-review-row portal-review-row--amount">
                            <span class="portal-review-label">Amount</span>
                            <span class="portal-review-value portal-review-amount" id="reviewAmount">$0.00</span>
                        </div>
                        <div class="portal-review-row">
                            <span class="portal-review-label">Description</span>
                            <span class="portal-review-value" id="reviewMemo">--</span>
                        </div>
                        <div class="portal-review-row">
                            <span class="portal-review-label">Date</span>
                            <span class="portal-review-value" id="reviewDate">--</span>
                        </div>
                    </div>

                    <div class="portal-review-actions">
                        <button class="btn btn-ghost btn-lg" id="goBackToDetails">Go Back</button>
                        <button class="btn btn-primary btn-lg" id="confirmTransfer">Confirm Transfer</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 3: Confirmation -->
        <div class="portal-transfer-step" id="step3" style="display:none">
            <div class="portal-card portal-card--center">
                <div class="portal-card-body">
                    <div class="portal-success-animation">
                        <svg class="portal-success-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" class="portal-success-circle"/>
                            <path d="M8 12l3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="portal-success-check"/>
                        </svg>
                    </div>
                    <h2 class="portal-success-title">Transfer Successful!</h2>
                    <p class="portal-success-subtitle">Your money is on its way.</p>

                    <div class="portal-review-summary portal-review-summary--compact">
                        <div class="portal-review-row">
                            <span class="portal-review-label">Amount</span>
                            <span class="portal-review-value" id="confirmAmount">$0.00</span>
                        </div>
                        <div class="portal-review-row">
                            <span class="portal-review-label">To</span>
                            <span class="portal-review-value" id="confirmTo">--</span>
                        </div>
                        <div class="portal-review-row">
                            <span class="portal-review-label">Reference #</span>
                            <span class="portal-review-value portal-review-ref" id="confirmRef">--</span>
                        </div>
                    </div>

                    <div class="portal-review-actions">
                        <a href="dashboard.html" class="btn btn-ghost btn-lg">Done</a>
                        <button class="btn btn-primary btn-lg" id="anotherTransfer">Make Another Transfer</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script>
(function() {
    // Auth check
    api.loadTokens();
    if (!auth.requireAuth(['member'])) return;

    // Navigation helpers
    const mobileToggle = document.getElementById('mobileMenuToggle');
    const navLinks = document.getElementById('navLinks');
    mobileToggle.addEventListener('click', () => navLinks.classList.toggle('open'));

    const userMenuTrigger = document.getElementById('userMenuTrigger');
    const userDropdown = document.getElementById('userDropdown');
    userMenuTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        userDropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => userDropdown.classList.remove('open'));
    document.getElementById('logoutBtn').addEventListener('click', () => auth.logout());

    // Load user info
    async function loadUser() {
        try {
            const user = await auth.getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Member';
                document.getElementById('userAvatar').textContent = Format.initials(user.first_name, user.last_name);
            }
        } catch (err) {}
    }
    loadUser();

    // State
    let currentStep = 1;
    let accounts = [];
    let transferType = 'own'; // 'own' or 'other'

    // Load accounts for dropdowns
    async function loadAccounts() {
        try {
            const response = await api.get('/accounts');
            accounts = response.accounts || response.data || response || [];
            accounts = accounts.filter(a => a.account_type !== 'loan');

            const fromSelect = document.getElementById('fromAccount');
            const toSelect = document.getElementById('toOwnAccount');

            accounts.forEach(acc => {
                const label = `${acc.name || acc.account_type} (${Format.accountNumber(acc.account_number || '')}) - ${Format.currency(acc.balance || 0)}`;
                fromSelect.add(new Option(label, acc.id));
                toSelect.add(new Option(label, acc.id));
            });
        } catch (err) {
            toast.error('Failed to load accounts');
        }
    }
    loadAccounts();

    // Transfer type toggle
    const toggleOwn = document.getElementById('toggleOwn');
    const toggleOther = document.getElementById('toggleOther');
    const toOwnGroup = document.getElementById('toOwnGroup');
    const toOtherGroup = document.getElementById('toOtherGroup');

    toggleOwn.addEventListener('click', () => {
        transferType = 'own';
        toggleOwn.classList.add('portal-toggle-btn--active');
        toggleOther.classList.remove('portal-toggle-btn--active');
        toOwnGroup.style.display = '';
        toOtherGroup.style.display = 'none';
    });

    toggleOther.addEventListener('click', () => {
        transferType = 'other';
        toggleOther.classList.add('portal-toggle-btn--active');
        toggleOwn.classList.remove('portal-toggle-btn--active');
        toOtherGroup.style.display = '';
        toOwnGroup.style.display = 'none';
    });

    // Step navigation
    function showStep(step) {
        currentStep = step;
        document.querySelectorAll('.portal-transfer-step').forEach(el => el.style.display = 'none');
        document.getElementById(`step${step}`).style.display = '';

        document.querySelectorAll('.portal-step').forEach(el => {
            const s = parseInt(el.dataset.step);
            el.classList.remove('portal-step--active', 'portal-step--completed');
            if (s === step) el.classList.add('portal-step--active');
            if (s < step) el.classList.add('portal-step--completed');
        });
    }

    // Validate step 1
    function validateStep1() {
        const fromId = document.getElementById('fromAccount').value;
        const amount = parseFloat(document.getElementById('transferAmount').value);

        if (!fromId) {
            toast.error('Please select a source account');
            return false;
        }

        if (transferType === 'own') {
            const toId = document.getElementById('toOwnAccount').value;
            if (!toId) { toast.error('Please select a destination account'); return false; }
            if (fromId === toId) { toast.error('Source and destination must be different'); return false; }
        } else {
            const toAccNum = document.getElementById('toOtherAccount').value.trim();
            if (!toAccNum) { toast.error('Please enter a recipient account number'); return false; }
        }

        if (!amount || amount <= 0) {
            toast.error('Please enter a valid amount');
            return false;
        }

        // Check balance
        const fromAccount = accounts.find(a => a.id == fromId);
        if (fromAccount && amount > fromAccount.balance) {
            toast.error('Insufficient balance');
            return false;
        }

        return true;
    }

    // Continue to review
    document.getElementById('continueToReview').addEventListener('click', () => {
        if (!validateStep1()) return;

        const fromId = document.getElementById('fromAccount').value;
        const fromAccount = accounts.find(a => a.id == fromId);
        const amount = parseFloat(document.getElementById('transferAmount').value);
        const memo = document.getElementById('transferMemo').value.trim();

        document.getElementById('reviewFrom').textContent = fromAccount
            ? `${fromAccount.name || fromAccount.account_type} (${Format.accountNumber(fromAccount.account_number || '')})`
            : fromId;

        if (transferType === 'own') {
            const toId = document.getElementById('toOwnAccount').value;
            const toAccount = accounts.find(a => a.id == toId);
            document.getElementById('reviewTo').textContent = toAccount
                ? `${toAccount.name || toAccount.account_type} (${Format.accountNumber(toAccount.account_number || '')})`
                : toId;
        } else {
            document.getElementById('reviewTo').textContent = `Account ${document.getElementById('toOtherAccount').value.trim()}`;
        }

        document.getElementById('reviewAmount').textContent = Format.currency(amount);
        document.getElementById('reviewMemo').textContent = memo || 'No description';
        document.getElementById('reviewDate').textContent = new Date().toLocaleDateString('en-US', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        showStep(2);
    });

    // Go back
    document.getElementById('goBackToDetails').addEventListener('click', () => showStep(1));

    // Confirm transfer
    document.getElementById('confirmTransfer').addEventListener('click', async () => {
        const btn = document.getElementById('confirmTransfer');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner spinner-sm"></span> Processing...';

        try {
            const fromId = document.getElementById('fromAccount').value;
            const amount = parseFloat(document.getElementById('transferAmount').value);
            const memo = document.getElementById('transferMemo').value.trim();

            const payload = {
                from_account_id: fromId,
                amount: amount,
                description: memo
            };

            if (transferType === 'own') {
                payload.to_account_id = document.getElementById('toOwnAccount').value;
            } else {
                payload.to_account_number = document.getElementById('toOtherAccount').value.trim();
            }

            const response = await api.post('/transfers', payload);

            document.getElementById('confirmAmount').textContent = Format.currency(amount);
            document.getElementById('confirmTo').textContent = document.getElementById('reviewTo').textContent;
            document.getElementById('confirmRef').textContent = response.reference_number || response.id || 'N/A';

            showStep(3);
        } catch (err) {
            toast.error(err.message || 'Transfer failed. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Confirm Transfer';
        }
    });

    // Another transfer
    document.getElementById('anotherTransfer').addEventListener('click', () => {
        document.getElementById('fromAccount').value = '';
        document.getElementById('toOwnAccount').value = '';
        document.getElementById('toOtherAccount').value = '';
        document.getElementById('transferAmount').value = '';
        document.getElementById('transferMemo').value = '';
        showStep(1);
    });
})();
</script>
</body>
</html>

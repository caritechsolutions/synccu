<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SyncCU - Loans">
    <title>Loans - SyncCU</title>
    <link rel="stylesheet" href="../css/app.css">
    <script>if (!localStorage.getItem('synccu-token')) { window.location.href = '../index.html'; }</script>
</head>
<body class="portal-body">

<!-- SVG Icon Sprite -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="icon-logo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-wallet" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-1M3 7a2 2 0 012-2h12a2 2 0 012 2M3 7h16m-3 4h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-transfer" viewBox="0 0 24 24"><path d="M8 7h12l-4-4M16 17H4l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-loan" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 00-5-5.917V4a1 1 0 10-2 0v1.083A6 6 0 006 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<!-- Top Navigation Bar -->
<nav class="portal-nav">
    <div class="portal-nav-inner">
        <div class="portal-nav-left">
            <button class="portal-mobile-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                <svg class="icon icon-md"><use href="#icon-menu"/></svg>
            </button>
            <a href="dashboard.html" class="portal-logo">
                <svg class="icon icon-lg"><use href="#icon-logo"/></svg>
                <span class="portal-logo-text">SyncCU</span>
            </a>
            <div class="portal-nav-links" id="navLinks">
                <a href="dashboard.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-home"/></svg> Dashboard
                </a>
                <a href="accounts.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-wallet"/></svg> Accounts
                </a>
                <a href="transfer.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-transfer"/></svg> Transfer
                </a>
                <a href="loans.html" class="portal-nav-link active">
                    <svg class="icon icon-sm"><use href="#icon-loan"/></svg> Loans
                </a>
            </div>
        </div>
        <div class="portal-nav-right">
            <button class="portal-nav-icon-btn theme-toggle" aria-label="Toggle theme">
                <svg class="icon icon-sm theme-icon-light"><use href="#icon-moon"/></svg>
                <svg class="icon icon-sm theme-icon-dark"><use href="#icon-sun"/></svg>
            </button>
            <button class="portal-nav-icon-btn portal-notification-btn" aria-label="Notifications">
                <svg class="icon icon-sm"><use href="#icon-bell"/></svg>
            </button>
            <div class="portal-user-menu" id="userMenu">
                <button class="portal-user-trigger" id="userMenuTrigger">
                    <span class="portal-avatar" id="userAvatar">--</span>
                    <span class="portal-user-name" id="userName">Member</span>
                    <svg class="icon icon-xs"><use href="#icon-chevron-down"/></svg>
                </button>
                <div class="portal-user-dropdown" id="userDropdown">
                    <a href="profile.html" class="portal-dropdown-item">
                        <svg class="icon icon-sm"><use href="#icon-user"/></svg> Profile
                    </a>
                    <a href="profile.html#security" class="portal-dropdown-item">
                        <svg class="icon icon-sm"><use href="#icon-settings"/></svg> Settings
                    </a>
                    <hr class="portal-dropdown-divider">
                    <button class="portal-dropdown-item portal-dropdown-logout" id="logoutBtn">
                        <svg class="icon icon-sm"><use href="#icon-logout"/></svg> Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="portal-main">
    <div class="portal-container">

        <h1 class="portal-page-title">Loans</h1>

        <!-- Active Loans -->
        <section class="portal-section" id="activeLoansSection">
            <h2 class="portal-section-title">Active Loans</h2>
            <div class="portal-loan-cards" id="loanCards">
                <div class="portal-skeleton-card"></div>
            </div>
        </section>

        <!-- Payment Schedule Accordion -->
        <section class="portal-section" id="scheduleSection" style="display:none">
            <h2 class="portal-section-title">Payment Schedules</h2>
            <div id="scheduleAccordions"></div>
        </section>

        <!-- Apply for New Loan -->
        <section class="portal-section">
            <div class="portal-card portal-apply-loan-card">
                <div class="portal-apply-loan-content">
                    <div>
                        <h3 class="portal-apply-loan-title">Need a loan?</h3>
                        <p class="portal-apply-loan-desc">Apply for a personal loan, auto loan, or home equity line of credit. Competitive rates and flexible terms available for members.</p>
                    </div>
                    <button class="btn btn-primary" id="applyLoanBtn" data-modal-open="loanApplicationModal">
                        <svg class="icon icon-sm"><use href="#icon-plus"/></svg> Apply Now
                    </button>
                </div>
            </div>
        </section>

    </div>
</main>

<!-- Make Payment Modal -->
<div class="modal-overlay" id="paymentModal">
    <div class="modal portal-modal">
        <div class="modal-header">
            <h3 class="modal-title">Make a Payment</h3>
            <button class="modal-close" data-modal-close="paymentModal">
                <svg class="icon icon-sm"><use href="#icon-x"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <form id="paymentForm">
                <div class="form-group">
                    <label class="form-label" for="paymentLoanSelect">Loan</label>
                    <select class="form-input" id="paymentLoanSelect" required>
                        <option value="">Select loan...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="paymentAmount">Payment Amount</label>
                    <div class="portal-amount-input">
                        <span class="portal-amount-currency">$</span>
                        <input type="number" class="form-input portal-amount-field" id="paymentAmount" min="0.01" step="0.01" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="paymentDate">Payment Date</label>
                    <input type="date" class="form-input" id="paymentDate" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="paymentFromAccount">Pay From Account</label>
                    <select class="form-input" id="paymentFromAccount" required>
                        <option value="">Select account...</option>
                    </select>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" data-modal-close="paymentModal">Cancel</button>
            <button class="btn btn-primary" id="submitPaymentBtn">Submit Payment</button>
        </div>
    </div>
</div>

<!-- Loan Application Modal -->
<div class="modal-overlay" id="loanApplicationModal">
    <div class="modal portal-modal">
        <div class="modal-header">
            <h3 class="modal-title">Apply for a Loan</h3>
            <button class="modal-close" data-modal-close="loanApplicationModal">
                <svg class="icon icon-sm"><use href="#icon-x"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <form id="loanApplicationForm">
                <div class="form-group">
                    <label class="form-label" for="appLoanType">Loan Type</label>
                    <select class="form-input" id="appLoanType" required>
                        <option value="">Select type...</option>
                        <option value="personal">Personal Loan</option>
                        <option value="auto">Auto Loan</option>
                        <option value="home_equity">Home Equity</option>
                        <option value="education">Education Loan</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="appAmount">Requested Amount</label>
                    <div class="portal-amount-input">
                        <span class="portal-amount-currency">$</span>
                        <input type="number" class="form-input portal-amount-field" id="appAmount" min="100" step="100" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="appTerm">Preferred Term</label>
                    <select class="form-input" id="appTerm" required>
                        <option value="">Select term...</option>
                        <option value="12">12 months</option>
                        <option value="24">24 months</option>
                        <option value="36">36 months</option>
                        <option value="48">48 months</option>
                        <option value="60">60 months</option>
                        <option value="84">84 months</option>
                        <option value="120">120 months</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="appPurpose">Purpose / Description</label>
                    <textarea class="form-input" id="appPurpose" rows="3" placeholder="Briefly describe the purpose of this loan..." required></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" data-modal-close="loanApplicationModal">Cancel</button>
            <button class="btn btn-primary" id="submitApplicationBtn">Submit Application</button>
        </div>
    </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script>
(function() {
    // Auth check
    api.loadTokens();
    if (!auth.requireAuth(['member'])) return;

    // Navigation helpers
    const mobileToggle = document.getElementById('mobileMenuToggle');
    const navLinks = document.getElementById('navLinks');
    mobileToggle.addEventListener('click', () => navLinks.classList.toggle('open'));

    const userMenuTrigger = document.getElementById('userMenuTrigger');
    const userDropdown = document.getElementById('userDropdown');
    userMenuTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        userDropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => userDropdown.classList.remove('open'));
    document.getElementById('logoutBtn').addEventListener('click', () => auth.logout());

    // Load user info
    async function loadUser() {
        try {
            const user = await auth.getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Member';
                document.getElementById('userAvatar').textContent = Format.initials(user.first_name, user.last_name);
            }
        } catch (err) {}
    }
    loadUser();

    // State
    let loans = [];
    let memberAccounts = [];

    // Set payment date default to today
    document.getElementById('paymentDate').valueAsDate = new Date();

    // Load loans
    async function loadLoans() {
        const container = document.getElementById('loanCards');
        try {
            const response = await api.get('/loans');
            loans = response.loans || response.data || response || [];

            if (!Array.isArray(loans) || loans.length === 0) {
                container.innerHTML = '<div class="portal-empty-state">You have no active loans</div>';
                return;
            }

            // Populate payment modal loan select
            const paymentSelect = document.getElementById('paymentLoanSelect');
            paymentSelect.innerHTML = '<option value="">Select loan...</option>';

            container.innerHTML = loans.map((loan, idx) => {
                const total = loan.total_amount || loan.original_amount || 1;
                const paid = loan.amount_paid || 0;
                const remaining = loan.remaining_balance || (total - paid);
                const paidPercent = Math.round((paid / total) * 100);

                paymentSelect.add(new Option(
                    `${loan.name || loan.loan_type || 'Loan'} - ${Format.currency(loan.monthly_payment || 0)}/mo`,
                    loan.id
                ));

                return `
                    <div class="portal-loan-card">
                        <div class="portal-loan-card-header">
                            <div>
                                <h4 class="portal-loan-card-title">${loan.name || loan.loan_type || 'Loan'}</h4>
                                <span class="portal-loan-card-number">${loan.loan_number || `#${loan.id}`}</span>
                            </div>
                            <span class="portal-status-badge portal-status-badge--${(loan.status || 'active').toLowerCase()}">${loan.status || 'Active'}</span>
                        </div>

                        <div class="portal-loan-progress">
                            <div class="portal-loan-progress-header">
                                <span>${Format.currency(paid)} paid</span>
                                <span>${Format.currency(total)} total</span>
                            </div>
                            <div class="portal-progress-bar">
                                <div class="portal-progress-fill portal-progress-fill--purple" style="width:${paidPercent}%"></div>
                            </div>
                            <span class="portal-loan-progress-percent">${paidPercent}% complete</span>
                        </div>

                        <div class="portal-loan-stats-grid">
                            <div class="portal-loan-stat">
                                <span class="portal-loan-stat-label">Monthly Payment</span>
                                <span class="portal-loan-stat-value">${Format.currency(loan.monthly_payment || 0)}</span>
                            </div>
                            <div class="portal-loan-stat">
                                <span class="portal-loan-stat-label">Interest Rate</span>
                                <span class="portal-loan-stat-value">${loan.interest_rate ? (loan.interest_rate * 100).toFixed(2) + '%' : 'N/A'}</span>
                            </div>
                            <div class="portal-loan-stat">
                                <span class="portal-loan-stat-label">Remaining</span>
                                <span class="portal-loan-stat-value">${Format.currency(remaining)}</span>
                            </div>
                            <div class="portal-loan-stat">
                                <span class="portal-loan-stat-label">Next Due</span>
                                <span class="portal-loan-stat-value">${loan.next_payment_date ? Format.date(loan.next_payment_date) : 'N/A'}</span>
                            </div>
                        </div>

                        <div class="portal-loan-card-actions">
                            <button class="btn btn-primary btn-sm portal-make-payment-btn" data-loan-id="${loan.id}" data-loan-amount="${loan.monthly_payment || 0}">Make Payment</button>
                            <button class="btn btn-outline btn-sm portal-view-schedule-btn" data-loan-id="${loan.id}" data-loan-index="${idx}">View Schedule</button>
                        </div>
                    </div>`;
            }).join('');

            // Attach event listeners
            document.querySelectorAll('.portal-make-payment-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('paymentLoanSelect').value = btn.dataset.loanId;
                    document.getElementById('paymentAmount').value = btn.dataset.loanAmount;
                    ModalManager.open('paymentModal');
                });
            });

            document.querySelectorAll('.portal-view-schedule-btn').forEach(btn => {
                btn.addEventListener('click', () => loadSchedule(btn.dataset.loanId, parseInt(btn.dataset.loanIndex)));
            });

        } catch (err) {
            container.innerHTML = '<div class="portal-empty-state">Unable to load loans</div>';
        }
    }

    // Load member accounts for payment source
    async function loadMemberAccounts() {
        try {
            const response = await api.get('/accounts');
            memberAccounts = (response.accounts || response.data || response || []).filter(a => a.account_type !== 'loan');

            const select = document.getElementById('paymentFromAccount');
            select.innerHTML = '<option value="">Select account...</option>';
            memberAccounts.forEach(acc => {
                select.add(new Option(
                    `${acc.name || acc.account_type} - ${Format.currency(acc.balance || 0)}`,
                    acc.id
                ));
            });
        } catch (err) {}
    }

    // Load payment schedule
    async function loadSchedule(loanId, loanIndex) {
        const section = document.getElementById('scheduleSection');
        const container = document.getElementById('scheduleAccordions');
        section.style.display = '';

        try {
            const response = await api.get(`/loans/${loanId}/schedule`);
            const schedule = response.schedule || response.data || response || [];
            const loan = loans[loanIndex] || {};

            // Check if accordion already exists
            let existing = document.getElementById(`schedule-${loanId}`);
            if (existing) {
                existing.classList.toggle('portal-accordion--open');
                section.scrollIntoView({ behavior: 'smooth' });
                return;
            }

            const html = `
                <div class="portal-accordion portal-accordion--open" id="schedule-${loanId}">
                    <button class="portal-accordion-trigger" onclick="this.parentElement.classList.toggle('portal-accordion--open')">
                        <span>${loan.name || loan.loan_type || 'Loan'} - Payment Schedule</span>
                        <svg class="icon icon-sm portal-accordion-icon"><use href="#icon-chevron-down"/></svg>
                    </button>
                    <div class="portal-accordion-content">
                        <div class="portal-table-responsive">
                            <table class="portal-table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Due Date</th>
                                        <th>Principal</th>
                                        <th>Interest</th>
                                        <th>Total</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${schedule.map(p => {
                                        const statusClass = p.status === 'paid' ? 'success' :
                                            p.status === 'overdue' ? 'danger' : 'info';
                                        return `<tr>
                                            <td>${p.payment_number || p.number || '-'}</td>
                                            <td>${Format.date(p.due_date)}</td>
                                            <td>${Format.currency(p.principal || 0)}</td>
                                            <td>${Format.currency(p.interest || 0)}</td>
                                            <td><strong>${Format.currency(p.total || (p.principal + p.interest) || 0)}</strong></td>
                                            <td><span class="portal-status-badge portal-status-badge--${statusClass}">${p.status || 'Upcoming'}</span></td>
                                        </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;

            container.insertAdjacentHTML('beforeend', html);
            section.scrollIntoView({ behavior: 'smooth' });
        } catch (err) {
            toast.error('Failed to load payment schedule');
        }
    }

    // Submit payment
    document.getElementById('submitPaymentBtn').addEventListener('click', async () => {
        const loanId = document.getElementById('paymentLoanSelect').value;
        const amount = parseFloat(document.getElementById('paymentAmount').value);
        const date = document.getElementById('paymentDate').value;
        const fromAccountId = document.getElementById('paymentFromAccount').value;

        if (!loanId || !amount || !date || !fromAccountId) {
            toast.error('Please fill in all fields');
            return;
        }

        const btn = document.getElementById('submitPaymentBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner spinner-sm"></span> Processing...';

        try {
            await api.post(`/loans/${loanId}/payments`, {
                amount,
                payment_date: date,
                from_account_id: fromAccountId
            });
            toast.success('Payment submitted successfully!');
            ModalManager.close('paymentModal');
            loadLoans(); // Refresh
        } catch (err) {
            toast.error(err.message || 'Payment failed');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Submit Payment';
        }
    });

    // Submit loan application
    document.getElementById('submitApplicationBtn').addEventListener('click', async () => {
        const type = document.getElementById('appLoanType').value;
        const amount = parseFloat(document.getElementById('appAmount').value);
        const term = document.getElementById('appTerm').value;
        const purpose = document.getElementById('appPurpose').value.trim();

        if (!type || !amount || !term || !purpose) {
            toast.error('Please fill in all fields');
            return;
        }

        const btn = document.getElementById('submitApplicationBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner spinner-sm"></span> Submitting...';

        try {
            await api.post('/loans/applications', {
                loan_type: type,
                requested_amount: amount,
                term_months: parseInt(term),
                purpose
            });
            toast.success('Loan application submitted! We will review and contact you soon.');
            ModalManager.close('loanApplicationModal');
            document.getElementById('loanApplicationForm').reset();
        } catch (err) {
            toast.error(err.message || 'Application failed. Please try again.');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Submit Application';
        }
    });

    // Scroll to payment section if hash is present
    if (window.location.hash === '#payment' && loans.length > 0) {
        ModalManager.open('paymentModal');
    }

    // Init
    loadLoans();
    loadMemberAccounts();
})();
</script>
</body>
</html>

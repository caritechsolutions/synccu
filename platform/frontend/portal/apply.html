<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SyncCU - Apply for Loans & Services">
    <title>Apply - SyncCU</title>
    <link rel="stylesheet" href="../css/app.css">
    <script>if (!localStorage.getItem('synccu-token')) { window.location.href = '../index.html'; }</script>

<body class="portal-body">

    <symbol id="icon-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zM14 2v6h6M16 13H8M16 17H8M10 9H8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-checking" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 10h20" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<!-- Top Navigation Bar -->
<nav class="portal-nav">
    <div class="portal-nav-inner">
        <div class="portal-nav-left">
            <button class="portal-mobile-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                <svg class="icon icon-md"><use href="#icon-menu"/></svg>
            </button>
            <a href="dashboard.html" class="portal-logo">
                <svg class="icon icon-lg"><use href="#icon-logo"/></svg>
                <span class="portal-logo-text">SyncCU</span>
            </a>
            <div class="portal-nav-links" id="navLinks">
                <a href="dashboard.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-home"/></svg> Dashboard
                </a>
                <a href="accounts.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-wallet"/></svg> Accounts
                </a>
                <a href="transfer.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-transfer"/></svg> Transfer
                </a>
                <a href="loans.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-loan"/></svg> Loans
                </a>
                <a href="messages.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-send"/></svg> Messages
                </a>
                <a href="apply.html" class="portal-nav-link active">
                    <svg class="icon icon-sm"><use href="#icon-file-text"/></svg> Apply
                </a>
                <a href="billpay.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-checking"/></svg> Bill Pay
                </a>
            </div>
        </div>
        <div class="portal-nav-right">
            <button class="portal-nav-icon-btn theme-toggle" aria-label="Toggle theme">
                <svg class="icon icon-sm theme-icon-light"><use href="#icon-moon"/></svg>
                <svg class="icon icon-sm theme-icon-dark"><use href="#icon-sun"/></svg>
            </button>
            <button class="portal-nav-icon-btn portal-notification-btn" aria-label="Notifications">
                <svg class="icon icon-sm"><use href="#icon-bell"/></svg>
            </button>
            <div class="portal-user-menu" id="userMenu">
                <button class="portal-user-trigger" id="userMenuTrigger">
                    <span class="portal-avatar" id="userAvatar">--</span>
                    <span class="portal-user-name" id="userName">Member</span>
                    <svg class="icon icon-xs"><use href="#icon-chevron-down"/></svg>
                </button>
                <div class="portal-user-dropdown" id="userDropdown">
                    <a href="profile.html" class="portal-dropdown-item">
                        <svg class="icon icon-sm"><use href="#icon-user"/></svg> Profile
                    </a>
                    <a href="profile.html#security" class="portal-dropdown-item">
                        <svg class="icon icon-sm"><use href="#icon-settings"/></svg> Settings
                    </a>
                    <hr class="portal-dropdown-divider">
                    <button class="portal-dropdown-item portal-dropdown-logout" id="logoutBtn">
                        <svg class="icon icon-sm"><use href="#icon-logout"/></svg> Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="portal-main">
    <div class="portal-container portal-container--narrow">

        <h1 class="portal-page-title">Apply for Loans &amp; Services</h1>
        <p class="portal-welcome-date">Submit an application and our team will review it shortly.</p>

        <!-- Application Form -->
        <section class="portal-card card">
            <div class="portal-card-header card-header">
                <h3 class="portal-card-title card-title">New Application</h3>
            </div>
            <div class="portal-card-body card-body">
                <form id="applyForm">
                    <div class="form-group">
                        <label class="form-label" for="appType">Application Type</label>
                        <select class="form-input form-select" id="appType" required>
                            <option value="loan">Loan</option>
                            <option value="service">Service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="product">Product</label>
                        <select class="form-input form-select" id="productLoan" required>
                            <option value="Personal Loan">Personal Loan</option>
                            <option value="Auto Loan">Auto Loan</option>
                            <option value="Mortgage">Mortgage</option>
                            <option value="Business Loan">Business Loan</option>
                            <option value="Education Loan">Education Loan</option>
                        </select>
                        <select class="form-input form-select" id="productService" style="display:none">
                            <option value="Checking Account">Checking Account</option>
                            <option value="Savings Account">Savings Account</option>
                            <option value="Share Certificate">Share Certificate</option>
                            <option value="Debit Card">Debit Card</option>
                            <option value="Online Statements">Online Statements</option>
                        </select>
                    </div>

                    <div class="form-row" id="loanFields">
                        <div class="form-group">
                            <label class="form-label" for="amount">Amount</label>
                            <input type="number" class="form-input" id="amount" placeholder="0.00" min="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="termMonths">Term (months)</label>
                            <input type="number" class="form-input" id="termMonths" placeholder="e.g. 36" min="1" step="1">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="details">Details</label>
                        <textarea class="form-input form-textarea" id="details" rows="4" placeholder="Tell us more about your request..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitApplyBtn">
                        <svg class="icon icon-sm"><use href="#icon-file-text"/></svg> Submit Application
                    </button>
                </form>
            </div>
        </section>

        <!-- My Applications -->
        <section class="portal-card card" style="margin-top:1.5rem">
            <div class="portal-card-header card-header">
                <h3 class="portal-card-title card-title">My Applications</h3>
            </div>
            <div class="portal-card-body card-body">
                <div id="applicationsList">
                    <p class="portal-empty-state">Loading applications...</p>
                </div>
            </div>
        </section>

    </div>
</main>

<style>
    .app-item {
        padding: 1rem;
        border: 1px solid var(--border-color, #e5e7eb);
        border-radius: var(--radius-lg, 12px);
        margin-bottom: 1rem;
    }
    .app-item:last-child { margin-bottom: 0; }
    .app-item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.5rem; }
    .app-item-title { font-weight: 600; }
    .app-item-sub { font-size: var(--text-sm, 0.875rem); color: var(--text-muted, #6b7280); }
    .app-item-notes { font-size: var(--text-sm, 0.875rem); margin-top: 0.5rem; }
    .app-item-notes strong { color: var(--text-secondary, #374151); }
    .app-item-foot { margin-top: 0.75rem; }
</style>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script>
(function() {
    // Auth check
    api.loadTokens();
    if (!auth.requireAuth(['member'])) return;

    // Navigation helpers
    const mobileToggle = document.getElementById('mobileMenuToggle');
    const navLinks = document.getElementById('navLinks');
    mobileToggle.addEventListener('click', () => navLinks.classList.toggle('open'));

    const userMenuTrigger = document.getElementById('userMenuTrigger');
    const userDropdown = document.getElementById('userDropdown');
    userMenuTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        userDropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => userDropdown.classList.remove('open'));
    document.getElementById('logoutBtn').addEventListener('click', () => auth.logout());

    // Load user info
    async function loadUser() {
        try {
            const user = await auth.getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Member';
                document.getElementById('userAvatar').textContent = Format.initials(user.first_name, user.last_name);
            }
        } catch (err) {}
    }
    loadUser();

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
    }

    // Toggle product group and loan-only fields based on app type
    const appType = document.getElementById('appType');
    const productLoan = document.getElementById('productLoan');
    const productService = document.getElementById('productService');
    const loanFields = document.getElementById('loanFields');

    function syncTypeUI() {
        const isLoan = appType.value === 'loan';
        productLoan.style.display = isLoan ? '' : 'none';
        productService.style.display = isLoan ? 'none' : '';
        loanFields.style.display = isLoan ? '' : 'none';
    }
    appType.addEventListener('change', syncTypeUI);
    syncTypeUI();

    // Status badge mapping (reuse existing badge-* classes)
    function statusBadge(status) {
        const map = {
            pending: 'badge-warning',
            in_review: 'badge-info',
            approved: 'badge-success',
            declined: 'badge-danger',
            cancelled: 'badge-neutral'
        };
        const cls = map[status] || 'badge-neutral';
        const label = (status || '').replace('_', ' ').replace(/\b\w/g, c => c.toUpperCase()) || 'Unknown';
        return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
    }

    const list = document.getElementById('applicationsList');

    async function loadApplications() {
        try {
            const resp = await api.get('/applications');
            const apps = (resp.data && resp.data.applications) || [];

            if (!apps.length) {
                list.innerHTML = '<p class="portal-empty-state">You have no applications yet.</p>';
                return;
            }

            list.innerHTML = apps.map(a => {
                const canCancel = a.status === 'pending' || a.status === 'in_review';
                const amountStr = a.amount != null && a.amount !== '' ? Format.currency(a.amount) : '';
                const termStr = a.term_months ? `${a.term_months} mo` : '';
                const metaBits = [a.app_type ? a.app_type.charAt(0).toUpperCase() + a.app_type.slice(1) : '', amountStr, termStr]
                    .filter(Boolean).map(escapeHtml).join(' &middot; ');
                return `
                    <div class="app-item">
                        <div class="app-item-head">
                            <div>
                                <div class="app-item-title">${escapeHtml(a.product || 'Application')}</div>
                                <div class="app-item-sub">${metaBits}</div>
                            </div>
                            ${statusBadge(a.status)}
                        </div>
                        ${a.details ? `<div class="app-item-sub">${escapeHtml(a.details)}</div>` : ''}
                        ${a.staff_notes ? `<div class="app-item-notes"><strong>Staff notes:</strong> ${escapeHtml(a.staff_notes)}</div>` : ''}
                        <div class="app-item-sub" style="margin-top:0.5rem">Submitted ${a.created_at ? escapeHtml(Format.date(a.created_at)) : ''}</div>
                        ${canCancel ? `<div class="app-item-foot"><button class="btn btn-ghost btn-sm" data-cancel="${escapeHtml(a.id)}">Cancel</button></div>` : ''}
                    </div>`;
            }).join('');

            list.querySelectorAll('[data-cancel]').forEach(btn => {
                btn.addEventListener('click', () => cancelApplication(btn.getAttribute('data-cancel'), btn));
            });
        } catch (err) {
            list.innerHTML = '<p class="portal-empty-state">Unable to load applications.</p>';
        }
    }
    loadApplications();

    async function cancelApplication(id, btn) {
        if (!confirm('Cancel this application?')) return;
        btn.disabled = true;
        try {
            await api.post('/applications/' + id + '/cancel');
            toast.success('Application cancelled');
            await loadApplications();
        } catch (err) {
            toast.error(err.message || 'Failed to cancel application');
            btn.disabled = false;
        }
    }

    // Submit application
    const form = document.getElementById('applyForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const isLoan = appType.value === 'loan';
        const product = (isLoan ? productLoan.value : productService.value);

        if (!product) {
            toast.error('Please select a product');
            return;
        }

        const payload = {
            app_type: appType.value,
            product: product,
            details: document.getElementById('details').value.trim()
        };

        if (isLoan) {
            const amount = parseFloat(document.getElementById('amount').value);
            const term = parseInt(document.getElementById('termMonths').value, 10);
            if (!isNaN(amount)) payload.amount = amount;
            if (!isNaN(term)) payload.term_months = term;
        }

        const btn = document.getElementById('submitApplyBtn');
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner spinner-sm"></span> Submitting...';

        try {
            await api.post('/applications', payload);
            toast.success('Application submitted');
            form.reset();
            syncTypeUI();
            await loadApplications();
        } catch (err) {
            toast.error(err.message || 'Failed to submit application');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    });
})();
</script>
</body>
</html>

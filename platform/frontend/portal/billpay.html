<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SyncCU - Bill Pay">
    <title>Bill Pay - SyncCU</title>
    <link rel="stylesheet" href="../css/app.css">
    <script>if (!localStorage.getItem('synccu-token')) { window.location.href = '../index.html'; }</script>
</head>
<body class="portal-body">

<!-- SVG Icon Sprite -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-wallet" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-1M3 7a2 2 0 012-2h12a2 2 0 012 2M3 7h16m-3 4h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-transfer" viewBox="0 0 24 24"><path d="M8 7h12l-4-4M16 17H4l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 00-5-5.917V4a1 1 0 10-2 0v1.083A6 6 0 006 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zM14 2v6h6M16 13H8M16 17H8M10 9H8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-checking" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 10h20" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<!-- Top Navigation Bar -->
<nav class="portal-nav">
    <div class="portal-nav-inner">
        <div class="portal-nav-left">
            <button class="portal-mobile-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                <svg class="icon icon-md"><use href="#icon-menu"/></svg>
            </button>
            <a href="dashboard.html" class="portal-logo">
                <svg class="icon icon-lg"><use href="#icon-logo"/></svg>
                <span class="portal-logo-text">SyncCU</span>
            </a>
            <div class="portal-nav-links" id="navLinks">
                <a href="dashboard.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-home"/></svg> Dashboard
                </a>
                <a href="accounts.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-wallet"/></svg> Accounts
                </a>
                <a href="transfer.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-transfer"/></svg> Transfer
                </a>
                <a href="loans.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-loan"/></svg> Loans
                </a>
                <a href="messages.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-send"/></svg> Messages
                </a>
                <a href="apply.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-file-text"/></svg> Apply
                </a>
                <a href="billpay.html" class="portal-nav-link active">
                    <svg class="icon icon-sm"><use href="#icon-checking"/></svg> Bill Pay
                </a>
            </div>
        </div>
        <div class="portal-nav-right">
            <button class="portal-nav-icon-btn theme-toggle" aria-label="Toggle theme">
                <svg class="icon icon-sm theme-icon-light"><use href="#icon-moon"/></svg>
                <svg class="icon icon-sm theme-icon-dark"><use href="#icon-sun"/></svg>
            </button>
            <button class="portal-nav-icon-btn portal-notification-btn" aria-label="Notifications">
                <svg class="icon icon-sm"><use href="#icon-bell"/></svg>
            </button>
            <div class="portal-user-menu" id="userMenu">
                <button class="portal-user-trigger" id="userMenuTrigger">
                    <span class="portal-avatar" id="userAvatar">--</span>
                    <span class="portal-user-name" id="userName">Member</span>
                    <svg class="icon icon-xs"><use href="#icon-chevron-down"/></svg>
                </button>
                <div class="portal-user-dropdown" id="userDropdown">
                    <a href="profile.html" class="portal-dropdown-item">
                        <svg class="icon icon-sm"><use href="#icon-user"/></svg> Profile
                    </a>
                    <a href="profile.html#security" class="portal-dropdown-item">
                        <svg class="icon icon-sm"><use href="#icon-settings"/></svg> Settings
                    </a>
                    <hr class="portal-dropdown-divider">
                    <button class="portal-dropdown-item portal-dropdown-logout" id="logoutBtn">
                        <svg class="icon icon-sm"><use href="#icon-logout"/></svg> Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="portal-main">
    <div class="portal-container portal-container--narrow">

        <h1 class="portal-page-title">Bill Pay</h1>
        <p class="portal-welcome-date">Pay your bills and manage your payees.</p>

        <!-- Make a Payment -->
        <section class="portal-card card">
            <div class="portal-card-header card-header">
                <h3 class="portal-card-title card-title">Make a Payment</h3>
            </div>
            <div class="portal-card-body card-body">
                <div id="paymentFormWrap">
                    <p class="portal-empty-state">Loading...</p>
                </div>
            </div>
        </section>

        <!-- Payees -->
        <section class="portal-card card" style="margin-top:1.5rem">
            <div class="portal-card-header card-header">
                <h3 class="portal-card-title card-title">Payees</h3>
            </div>
            <div class="portal-card-body card-body">
                <div id="payeesList">
                    <p class="portal-empty-state">Loading payees...</p>
                </div>

                <form id="payeeForm" style="margin-top:1.5rem">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="payeeName">Name</label>
                            <input type="text" class="form-input" id="payeeName" placeholder="e.g. City Power &amp; Light" maxlength="120" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="payeeCategory">Category</label>
                            <input type="text" class="form-input" id="payeeCategory" placeholder="e.g. Utilities" maxlength="60">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="payeeReference">Account Reference</label>
                        <input type="text" class="form-input" id="payeeReference" placeholder="Your account number with the payee" maxlength="60">
                    </div>
                    <button type="submit" class="btn btn-secondary" id="addPayeeBtn">
                        <svg class="icon icon-sm"><use href="#icon-user"/></svg> Add Payee
                    </button>
                </form>
            </div>
        </section>

        <!-- Recent Payments -->
        <section class="portal-card card" style="margin-top:1.5rem">
            <div class="portal-card-header card-header">
                <h3 class="portal-card-title card-title">Recent Payments</h3>
            </div>
            <div class="portal-card-body card-body">
                <div id="paymentsList">
                    <p class="portal-empty-state">Loading payments...</p>
                </div>
            </div>
        </section>

    </div>
</main>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script>
(function() {
    // Auth check
    api.loadTokens();
    if (!auth.requireAuth(['member'])) return;

    // Navigation helpers
    const mobileToggle = document.getElementById('mobileMenuToggle');
    const navLinks = document.getElementById('navLinks');
    mobileToggle.addEventListener('click', () => navLinks.classList.toggle('open'));

    const userMenuTrigger = document.getElementById('userMenuTrigger');
    const userDropdown = document.getElementById('userDropdown');
    userMenuTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        userDropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => userDropdown.classList.remove('open'));
    document.getElementById('logoutBtn').addEventListener('click', () => auth.logout());

    // Load user info
    async function loadUser() {
        try {
            const user = await auth.getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Member';
                document.getElementById('userAvatar').textContent = Format.initials(user.first_name, user.last_name);
            }
        } catch (err) {}
    }
    loadUser();

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
    }

    function titleCase(str) {
        return (str || '').charAt(0).toUpperCase() + (str || '').slice(1);
    }

    // Status badge mapping for payments (reuse existing badge-* classes)
    function statusBadge(status) {
        const map = {
            completed: 'badge-success',
            pending: 'badge-warning',
            failed: 'badge-danger'
        };
        const cls = map[status] || 'badge-warning';
        return `<span class="badge ${cls}">${escapeHtml(titleCase(status) || 'Pending')}</span>`;
    }

    const paymentFormWrap = document.getElementById('paymentFormWrap');
    const payeesList = document.getElementById('payeesList');
    const paymentsList = document.getElementById('paymentsList');

    // Cached state used to build the payment form
    let eligibleAccounts = [];
    let payees = [];

    // ----- Make a Payment form -----
    function renderPaymentForm() {
        if (!eligibleAccounts.length) {
            paymentFormWrap.innerHTML = '<p class="portal-empty-state">You have no eligible account to pay from. Open or activate a checking or savings account to make a payment.</p>';
            return;
        }
        if (!payees.length) {
            paymentFormWrap.innerHTML = '<p class="portal-empty-state">Add a payee below before making a payment.</p>';
            return;
        }

        const accountOptions = eligibleAccounts.map(a => {
            const label = `${titleCase(a.account_type)} ${Format.accountNumber(a.account_number)} — ${Format.currency(a.balance)}`;
            return `<option value="${escapeHtml(a.id)}">${escapeHtml(label)}</option>`;
        }).join('');

        const payeeOptions = payees.map(p =>
            `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`
        ).join('');

        paymentFormWrap.innerHTML = `
            <form id="paymentForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="fromAccount">Pay From</label>
                        <select class="form-input form-select" id="fromAccount" required>${accountOptions}</select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="payeeSelect">Payee</label>
                        <select class="form-input form-select" id="payeeSelect" required>${payeeOptions}</select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="payAmount">Amount</label>
                        <input type="number" class="form-input" id="payAmount" placeholder="0.00" min="0.01" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="payMemo">Memo</label>
                        <input type="text" class="form-input" id="payMemo" placeholder="Optional note" maxlength="120">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="submitPaymentBtn">
                    <svg class="icon icon-sm"><use href="#icon-checking"/></svg> Submit Payment
                </button>
            </form>`;

        document.getElementById('paymentForm').addEventListener('submit', submitPayment);
    }

    async function submitPayment(e) {
        e.preventDefault();
        const from_account_id = document.getElementById('fromAccount').value;
        const payee_id = document.getElementById('payeeSelect').value;
        const amount = document.getElementById('payAmount').value;
        const memo = document.getElementById('payMemo').value.trim();

        if (!from_account_id || !payee_id) {
            toast.error('Please choose an account and a payee');
            return;
        }
        if (!(Number(amount) > 0)) {
            toast.error('Please enter a valid amount');
            return;
        }

        const btn = document.getElementById('submitPaymentBtn');
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner spinner-sm"></span> Submitting...';

        try {
            await api.post('/billpay', { from_account_id, payee_id, amount: Number(amount), memo });
            toast.success('Payment submitted');
            await Promise.all([loadPayees(), loadPayments(), loadAccounts()]);
        } catch (err) {
            toast.error(err.message || 'Failed to submit payment');
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    }

    // ----- Accounts -----
    async function loadAccounts() {
        try {
            const resp = await api.get('/accounts');
            const accounts = (resp.data) || [];
            eligibleAccounts = accounts.filter(a => a.account_type !== 'loan' && a.status === 'active');
        } catch (err) {
            eligibleAccounts = [];
        }
        renderPaymentForm();
    }

    // ----- Payees -----
    async function loadPayees() {
        try {
            const resp = await api.get('/payees');
            payees = (resp.data && resp.data.payees) || [];

            if (!payees.length) {
                payeesList.innerHTML = '<p class="portal-empty-state">You have no payees yet. Add one below to get started.</p>';
            } else {
                payeesList.innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr><th>Name</th><th>Category</th><th>Account Reference</th><th></th></tr>
                        </thead>
                        <tbody>
                            ${payees.map(p => `
                                <tr>
                                    <td>${escapeHtml(p.name)}</td>
                                    <td>${escapeHtml(p.category) || '—'}</td>
                                    <td>${escapeHtml(p.account_reference) || '—'}</td>
                                    <td><button class="btn btn-secondary btn-sm" data-remove="${escapeHtml(p.id)}">
                                        <svg class="icon icon-sm"><use href="#icon-x"/></svg> Remove
                                    </button></td>
                                </tr>`).join('')}
                        </tbody>
                    </table>`;

                payeesList.querySelectorAll('[data-remove]').forEach(btn => {
                    btn.addEventListener('click', () => removePayee(btn.getAttribute('data-remove'), btn));
                });
            }
        } catch (err) {
            payees = [];
            payeesList.innerHTML = '<p class="portal-empty-state">Unable to load payees.</p>';
        }
        renderPaymentForm();
    }

    async function removePayee(id, btn) {
        if (!confirm('Remove this payee?')) return;
        btn.disabled = true;
        try {
            await api.delete('/payees/' + id);
            toast.success('Payee removed');
            await loadPayees();
        } catch (err) {
            toast.error(err.message || 'Failed to remove payee');
            btn.disabled = false;
        }
    }

    // Add payee form
    const payeeForm = document.getElementById('payeeForm');
    payeeForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('payeeName').value.trim();
        const category = document.getElementById('payeeCategory').value.trim();
        const account_reference = document.getElementById('payeeReference').value.trim();

        if (!name) {
            toast.error('Please enter a payee name');
            return;
        }

        const btn = document.getElementById('addPayeeBtn');
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner spinner-sm"></span> Adding...';

        try {
            await api.post('/payees', { name, category, account_reference });
            toast.success('Payee added');
            payeeForm.reset();
            await loadPayees();
        } catch (err) {
            toast.error(err.message || 'Failed to add payee');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    });

    // ----- Recent Payments -----
    async function loadPayments() {
        try {
            const resp = await api.get('/billpay');
            const payments = (resp.data && resp.data.payments) || [];

            if (!payments.length) {
                paymentsList.innerHTML = '<p class="portal-empty-state">No payments yet.</p>';
                return;
            }

            paymentsList.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr><th>Date</th><th>Payee</th><th>Account</th><th>Amount</th><th>Reference</th><th>Status</th></tr>
                    </thead>
                    <tbody>
                        ${payments.map(p => `
                            <tr>
                                <td>${p.created_at ? escapeHtml(Format.date(p.created_at)) : '—'}</td>
                                <td>${escapeHtml(p.payee_name || 'Payment')}</td>
                                <td>${escapeHtml(p.account_number) || '—'}</td>
                                <td>${escapeHtml(Format.currency(p.amount))}</td>
                                <td>${escapeHtml(p.reference_number) || '—'}</td>
                                <td>${statusBadge(p.status)}</td>
                            </tr>`).join('')}
                    </tbody>
                </table>`;
        } catch (err) {
            paymentsList.innerHTML = '<p class="portal-empty-state">Unable to load payments.</p>';
        }
    }

    // Initial load
    loadPayees();
    loadPayments();
    loadAccounts();
})();
</script>
</body>
</html>

            <a href="dashboard.html" class="portal-logo">

                <a href="dashboard.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-home"/></svg> Dashboard
                </a>

                    <svg class="icon icon-sm"><use href="#icon-wallet"/></svg> Accounts
                </a>
                <a href="transfer.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-transfer"/></svg> Transfer
                </a>
                <a href="loans.html" class="portal-nav-link">

                </a>
                <a href="messages.html" class="portal-nav-link active">

                </a>
                <a href="apply.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-file-text"/></svg> Apply
                </a>

                <svg class="icon icon-sm theme-icon-light"><use href="#icon-moon"/></svg>
                <svg class="icon icon-sm theme-icon-dark"><use href="#icon-sun"/></svg>
            </button>

                    <span class="portal-user-name" id="userName">Member</span>

<!-- Main Content -->
<main class="portal-main">
    <div class="portal-container portal-container--narrow">

        <h1 class="portal-page-title">Secure Messages</h1>
        <p class="portal-welcome-date">Send and receive secure messages with our team.</p>

        <!-- New Message -->
        <section class="portal-card card">
            <div class="portal-card-header card-header">
                <h3 class="portal-card-title card-title">New Message</h3>
            </div>
            <div class="portal-card-body card-body">
                <form id="messageForm">
                    <div class="form-group">
                        <label class="form-label" for="msgSubject">Subject</label>
                        <input type="text" class="form-input" id="msgSubject" placeholder="What is your message about?" maxlength="200" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="msgBody">Message</label>
                        <textarea class="form-input form-textarea" id="msgBody" rows="4" placeholder="Type your message..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="sendMessageBtn">
                        <svg class="icon icon-sm"><use href="#icon-send"/></svg> Send Message
                    </button>
                </form>
            </div>
        </section>

        <!-- Conversation -->
        <section class="portal-card card" style="margin-top:1.5rem">
            <div class="portal-card-header card-header">
                <h3 class="portal-card-title card-title">Conversation</h3>
            </div>
            <div class="portal-card-body card-body">
                <div id="messageThread" class="message-thread">
                    <p class="portal-empty-state">Loading messages...</p>
                </div>
            </div>
        </section>

    </div>
</main>

<style>
    .message-thread { display: flex; flex-direction: column; gap: 1rem; }
    .msg-bubble {
        max-width: 75%;
        padding: 0.75rem 1rem;
        border-radius: var(--radius-lg, 12px);
        border: 1px solid var(--border-color, #e5e7eb);
    }
    .msg-bubble--member {
        align-self: flex-end;
        background: var(--primary-light, #e0eaff);
        color: var(--text-primary, #111);
        border-color: transparent;
    }
    .msg-bubble--staff {
        align-self: flex-start;
        background: var(--bg-tertiary, #f3f4f6);
        color: var(--text-primary, #111);
    }
    .msg-bubble-meta {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        font-size: var(--text-xs, 0.75rem);
        color: var(--text-muted, #6b7280);
        margin-bottom: 0.25rem;
    }
    .msg-bubble-subject { font-weight: 600; margin-bottom: 0.25rem; }
    .msg-bubble-body { white-space: pre-wrap; word-break: break-word; }
</style>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script>
(function() {
    // Auth check
    api.loadTokens();
    if (!auth.requireAuth(['member'])) return;

    // Navigation helpers
    const mobileToggle = document.getElementById('mobileMenuToggle');
    const navLinks = document.getElementById('navLinks');
    mobileToggle.addEventListener('click', () => navLinks.classList.toggle('open'));

    const userMenuTrigger = document.getElementById('userMenuTrigger');
    const userDropdown = document.getElementById('userDropdown');
    userMenuTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        userDropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => userDropdown.classList.remove('open'));
    document.getElementById('logoutBtn').addEventListener('click', () => auth.logout());

    // Load user info
    async function loadUser() {
        try {
            const user = await auth.getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Member';
                document.getElementById('userAvatar').textContent = Format.initials(user.first_name, user.last_name);
            }
        } catch (err) {}
    }
    loadUser();

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
    }

    const thread = document.getElementById('messageThread');

    // Load and render the conversation thread
    async function loadThread() {
        try {
            const resp = await api.get('/messages');
            const messages = (resp.data && resp.data.messages) || [];

            if (!messages.length) {
                thread.innerHTML = '<p class="portal-empty-state">No messages yet. Start the conversation above.</p>';
                return;
            }

            thread.innerHTML = messages.map(m => {
                const isMember = m.sender === 'member';
                const who = isMember ? 'You' : (m.staff_name || 'SyncCU Team');
                const when = m.created_at ? Format.relative(m.created_at) : '';
                return `
                    <div class="msg-bubble msg-bubble--${isMember ? 'member' : 'staff'}">
                        <div class="msg-bubble-meta">
                            <span>${escapeHtml(who)}</span>
                            <span>${escapeHtml(when)}</span>
                        </div>
                        ${m.subject ? `<div class="msg-bubble-subject">${escapeHtml(m.subject)}</div>` : ''}
                        <div class="msg-bubble-body">${escapeHtml(m.body)}</div>
                    </div>`;
            }).join('');
        } catch (err) {
            thread.innerHTML = '<p class="portal-empty-state">Unable to load messages.</p>';
        }
    }
    loadThread();

    // Submit a new message
    const form = document.getElementById('messageForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const subject = document.getElementById('msgSubject').value.trim();
        const body = document.getElementById('msgBody').value.trim();

        if (!subject || !body) {
            toast.error('Please enter a subject and message');
            return;
        }

        const btn = document.getElementById('sendMessageBtn');
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner spinner-sm"></span> Sending...';

        try {
            await api.post('/messages', { subject, body });
            toast.success('Message sent');
            form.reset();
            await loadThread();
        } catch (err) {
            toast.error(err.message || 'Failed to send message');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    });
})();
</script>
</body>
</html>

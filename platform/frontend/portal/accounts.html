<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SyncCU - Account Details">
    <title>Accounts - SyncCU</title>
    <link rel="stylesheet" href="../css/app.css">
    <script>if (!localStorage.getItem('synccu-token')) { window.location.href = '../index.html'; }</script>
</head>
<body class="portal-body">

<!-- SVG Icon Sprite -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="icon-logo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-wallet" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-1M3 7a2 2 0 012-2h12a2 2 0 012 2M3 7h16m-3 4h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-transfer" viewBox="0 0 24 24"><path d="M8 7h12l-4-4M16 17H4l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-loan" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 00-5-5.917V4a1 1 0 10-2 0v1.083A6 6 0 006 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5m0 0l-7 7m7-7l7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14m0 0l7-7m-7 7l-7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5m0 0l7 7m-7-7l7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zM14 2v6h6M16 13H8M16 17H8M10 9H8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-checking" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 10h20" stroke="currentColor" stroke-width="2"/></symbol>
</svg>

<!-- Top Navigation Bar -->
<nav class="portal-nav">
    <div class="portal-nav-inner">
        <div class="portal-nav-left">
            <button class="portal-mobile-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                <svg class="icon icon-md"><use href="#icon-menu"/></svg>
            </button>
            <a href="dashboard.html" class="portal-logo">
                <svg class="icon icon-lg"><use href="#icon-logo"/></svg>
                <span class="portal-logo-text">SyncCU</span>
            </a>
            <div class="portal-nav-links" id="navLinks">
                <a href="dashboard.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-home"/></svg> Dashboard
                </a>
                <a href="accounts.html" class="portal-nav-link active">
                    <svg class="icon icon-sm"><use href="#icon-wallet"/></svg> Accounts
                </a>
                <a href="transfer.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-transfer"/></svg> Transfer
                </a>
                <a href="loans.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-loan"/></svg> Loans
                </a>
                <a href="messages.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-send"/></svg> Messages
                </a>
                <a href="apply.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-file-text"/></svg> Apply
                </a>
                <a href="billpay.html" class="portal-nav-link">
                    <svg class="icon icon-sm"><use href="#icon-checking"/></svg> Bill Pay
                </a>
            </div>
        </div>
        <div class="portal-nav-right">
            <button class="portal-nav-icon-btn theme-toggle" aria-label="Toggle theme">
                <svg class="icon icon-sm theme-icon-light"><use href="#icon-moon"/></svg>
                <svg class="icon icon-sm theme-icon-dark"><use href="#icon-sun"/></svg>
            </button>
            <button class="portal-nav-icon-btn portal-notification-btn" aria-label="Notifications">
                <svg class="icon icon-sm"><use href="#icon-bell"/></svg>
            </button>
            <div class="portal-user-menu" id="userMenu">
                <button class="portal-user-trigger" id="userMenuTrigger">
                    <span class="portal-avatar" id="userAvatar">--</span>
                    <span class="portal-user-name" id="userName">Member</span>
                    <svg class="icon icon-xs"><use href="#icon-chevron-down"/></svg>
                </button>
                <div class="portal-user-dropdown" id="userDropdown">
                    <a href="profile.html" class="portal-dropdown-item">
                        <svg class="icon icon-sm"><use href="#icon-user"/></svg> Profile
                    </a>
                    <a href="profile.html#security" class="portal-dropdown-item">
                        <svg class="icon icon-sm"><use href="#icon-settings"/></svg> Settings
                    </a>
                    <hr class="portal-dropdown-divider">
                    <button class="portal-dropdown-item portal-dropdown-logout" id="logoutBtn">
                        <svg class="icon icon-sm"><use href="#icon-logout"/></svg> Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="portal-main">
    <div class="portal-container">

        <!-- Account List View (when no specific account selected) -->
        <div id="accountListView">
            <div class="portal-breadcrumb">
                <a href="dashboard.html" class="portal-breadcrumb-link">Dashboard</a>
                <span class="portal-breadcrumb-sep">/</span>
                <span class="portal-breadcrumb-current">Accounts</span>
            </div>

            <h1 class="portal-page-title">Your Accounts</h1>

            <div class="portal-account-cards" id="accountListCards">
                <div class="portal-skeleton-card"></div>
                <div class="portal-skeleton-card"></div>
            </div>
        </div>

        <!-- Account Detail View (when specific account selected) -->
        <div id="accountDetailView" style="display:none">
            <div class="portal-breadcrumb">
                <button class="portal-breadcrumb-back" id="backToAccounts">
                    <svg class="icon icon-sm"><use href="#icon-arrow-left"/></svg>
                </button>
                <a href="accounts.html" class="portal-breadcrumb-link">Accounts</a>
                <span class="portal-breadcrumb-sep">/</span>
                <span class="portal-breadcrumb-current" id="accountBreadcrumb">Account</span>
            </div>

            <!-- Account Header -->
            <div class="portal-account-header">
                <div class="portal-account-header-info">
                    <div class="portal-account-header-balance">
                        <span class="portal-account-header-label">Available Balance</span>
                        <h1 class="portal-account-header-amount" id="detailBalance">$0.00</h1>
                    </div>
                    <div class="portal-account-header-meta">
                        <span class="portal-account-header-number" id="detailAccountNumber">Account ----</span>
                        <span class="portal-account-type-badge" id="detailTypeBadge">Savings</span>
                        <span class="portal-status-badge" id="detailStatus">Active</span>
                    </div>
                </div>
                <div class="portal-account-header-actions">
                    <button class="btn btn-outline btn-sm" id="downloadStatementBtn">
                        <svg class="icon icon-sm"><use href="#icon-download"/></svg> Download Statement
                    </button>
                    <a href="transfer.html" class="btn btn-primary btn-sm">
                        <svg class="icon icon-sm"><use href="#icon-transfer"/></svg> Transfer From
                    </a>
                </div>
            </div>

            <!-- Filters -->
            <div class="portal-filters">
                <div class="portal-filter-group">
                    <label class="portal-filter-label">Date Range</label>
                    <div class="portal-filter-dates">
                        <input type="date" class="form-input form-input-sm" id="filterDateFrom">
                        <span class="portal-filter-sep">to</span>
                        <input type="date" class="form-input form-input-sm" id="filterDateTo">
                    </div>
                </div>
                <div class="portal-filter-group">
                    <label class="portal-filter-label">Type</label>
                    <select class="form-input form-input-sm" id="filterType">
                        <option value="all">All Transactions</option>
                        <option value="credit">Credits Only</option>
                        <option value="debit">Debits Only</option>
                    </select>
                </div>
                <div class="portal-filter-group portal-filter-search">
                    <label class="portal-filter-label">Search</label>
                    <div class="portal-search-input">
                        <svg class="icon icon-sm portal-search-icon"><use href="#icon-search"/></svg>
                        <input type="text" class="form-input form-input-sm" id="filterSearch" placeholder="Search transactions...">
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm portal-filter-clear" id="clearFilters">Clear</button>
            </div>

            <!-- Transaction History -->
            <div class="portal-card">
                <div class="portal-card-header">
                    <h3 class="portal-card-title">Transaction History</h3>
                    <span class="portal-transaction-count" id="txCount">0 transactions</span>
                </div>
                <div class="portal-transaction-list portal-transaction-list--detailed" id="transactionList">
                    <div class="portal-skeleton-row"></div>
                    <div class="portal-skeleton-row"></div>
                    <div class="portal-skeleton-row"></div>
                    <div class="portal-skeleton-row"></div>
                    <div class="portal-skeleton-row"></div>
                </div>
                <div class="portal-load-more" id="loadMoreContainer" style="display:none">
                    <button class="btn btn-outline btn-sm" id="loadMoreBtn">Load More</button>
                </div>
            </div>
        </div>

    </div>
</main>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script>
(function() {
    // Auth check
    api.loadTokens();
    if (!auth.requireAuth(['member'])) return;

    // Navigation helpers
    const mobileToggle = document.getElementById('mobileMenuToggle');
    const navLinks = document.getElementById('navLinks');
    mobileToggle.addEventListener('click', () => navLinks.classList.toggle('open'));

    const userMenuTrigger = document.getElementById('userMenuTrigger');
    const userDropdown = document.getElementById('userDropdown');
    userMenuTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        userDropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => userDropdown.classList.remove('open'));
    document.getElementById('logoutBtn').addEventListener('click', () => auth.logout());

    // Load user info
    async function loadUser() {
        try {
            const user = await auth.getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Member';
                document.getElementById('userAvatar').textContent = Format.initials(user.first_name, user.last_name);
            }
        } catch (err) {}
    }
    loadUser();

    // State
    let currentAccountId = null;
    let allTransactions = [];
    let displayedCount = 0;
    const perPage = 20;

    // Check URL for account ID
    const urlParams = new URLSearchParams(window.location.search);
    const accountIdParam = urlParams.get('id');

    if (accountIdParam) {
        showAccountDetail(accountIdParam);
    } else {
        loadAccountList();
    }

    // Load account list
    async function loadAccountList() {
        document.getElementById('accountListView').style.display = '';
        document.getElementById('accountDetailView').style.display = 'none';
        const container = document.getElementById('accountListCards');

        try {
            const response = await api.get('/accounts');
            const accounts = response.accounts || response.data || response || [];

            if (!Array.isArray(accounts) || accounts.length === 0) {
                container.innerHTML = '<div class="portal-empty-state">No accounts found</div>';
                return;
            }

            const typeConfig = {
                savings: { icon: 'savings', color: 'blue', label: 'Savings' },
                checking: { icon: 'checking', color: 'green', label: 'Checking' },
                loan: { icon: 'loan', color: 'purple', label: 'Loan' }
            };

            container.innerHTML = accounts.map(acc => {
                const config = typeConfig[acc.account_type] || typeConfig.savings;
                return `
                    <a href="accounts.html?id=${acc.id}" class="portal-account-card portal-account-card--${config.color} portal-account-card--clickable">
                        <div class="portal-account-card-top">
                            <span class="portal-account-type-badge portal-badge--${config.color}">${config.label}</span>
                            <span class="portal-status-badge portal-status-badge--${acc.status || 'active'}">${acc.status || 'Active'}</span>
                        </div>
                        <h4 class="portal-account-name">${acc.name || config.label + ' Account'}</h4>
                        <p class="portal-account-number">${Format.accountNumber(acc.account_number || '')}</p>
                        <p class="portal-account-balance">${Format.currency(acc.balance || 0)}</p>
                    </a>`;
            }).join('');
        } catch (err) {
            container.innerHTML = '<div class="portal-empty-state">Unable to load accounts</div>';
        }
    }

    // Show account detail
    async function showAccountDetail(accountId) {
        currentAccountId = accountId;
        document.getElementById('accountListView').style.display = 'none';
        document.getElementById('accountDetailView').style.display = '';

        try {
            const account = await api.get(`/accounts/${accountId}`);
            const acc = account.account || account.data || account;

            const typeConfig = {
                savings: { color: 'blue', label: 'Savings' },
                checking: { color: 'green', label: 'Checking' },
                loan: { color: 'purple', label: 'Loan' }
            };
            const config = typeConfig[acc.account_type] || typeConfig.savings;

            document.getElementById('accountBreadcrumb').textContent = acc.name || config.label + ' Account';
            document.getElementById('detailBalance').textContent = Format.currency(acc.balance || 0);
            document.getElementById('detailAccountNumber').textContent = `Account ${acc.account_number || '----'}`;

            const badge = document.getElementById('detailTypeBadge');
            badge.textContent = config.label;
            badge.className = `portal-account-type-badge portal-badge--${config.color}`;

            const statusBadge = document.getElementById('detailStatus');
            statusBadge.textContent = acc.status || 'Active';
            statusBadge.className = `portal-status-badge portal-status-badge--${(acc.status || 'active').toLowerCase()}`;

            loadTransactions();
        } catch (err) {
            toast.error('Failed to load account details');
        }
    }

    // Load transactions
    async function loadTransactions(append = false) {
        const container = document.getElementById('transactionList');
        if (!append) {
            displayedCount = 0;
            container.innerHTML = '<div class="portal-skeleton-row"></div><div class="portal-skeleton-row"></div>';
        }

        try {
            const params = { account_id: currentAccountId, limit: perPage, offset: displayedCount };

            const fromDate = document.getElementById('filterDateFrom').value;
            const toDate = document.getElementById('filterDateTo').value;
            const type = document.getElementById('filterType').value;
            const search = document.getElementById('filterSearch').value.trim();

            if (fromDate) params.from_date = fromDate;
            if (toDate) params.to_date = toDate;
            if (type !== 'all') params.type = type;
            if (search) params.search = search;

            const response = await api.get('/transactions', params);
            const transactions = response.transactions || response.data || response || [];
            const total = response.total || transactions.length;

            if (!append) allTransactions = [];
            allTransactions = allTransactions.concat(transactions);
            displayedCount = allTransactions.length;

            document.getElementById('txCount').textContent = `${total} transaction${total !== 1 ? 's' : ''}`;

            if (!append) container.innerHTML = '';

            if (allTransactions.length === 0) {
                container.innerHTML = '<p class="portal-empty-state">No transactions found</p>';
                document.getElementById('loadMoreContainer').style.display = 'none';
                return;
            }

            const html = transactions.map(tx => {
                const isCredit = tx.type === 'credit' || tx.amount > 0;
                const absAmount = Math.abs(tx.amount);
                return `
                    <div class="portal-transaction-item portal-transaction-item--detailed">
                        <div class="portal-transaction-icon portal-transaction-icon--${isCredit ? 'credit' : 'debit'}">
                            <svg class="icon icon-sm"><use href="${isCredit ? '#icon-arrow-down' : '#icon-arrow-up'}"/></svg>
                        </div>
                        <div class="portal-transaction-info">
                            <span class="portal-transaction-desc">${tx.description || tx.memo || 'Transaction'}</span>
                            <span class="portal-transaction-date">${Format.date(tx.created_at || tx.date)}</span>
                        </div>
                        ${tx.category ? `<span class="portal-category-tag">${tx.category}</span>` : ''}
                        <span class="portal-transaction-amount portal-transaction-amount--${isCredit ? 'credit' : 'debit'}">
                            ${isCredit ? '+' : '-'}${Format.currency(absAmount)}
                        </span>
                    </div>`;
            }).join('');

            if (append) {
                container.insertAdjacentHTML('beforeend', html);
            } else {
                container.innerHTML = html;
            }

            // Show/hide load more
            document.getElementById('loadMoreContainer').style.display =
                displayedCount < total ? '' : 'none';
        } catch (err) {
            if (!append) container.innerHTML = '<p class="portal-empty-state">Unable to load transactions</p>';
        }
    }

    // Back button
    document.getElementById('backToAccounts').addEventListener('click', () => {
        window.history.pushState({}, '', 'accounts.html');
        loadAccountList();
    });

    // Filters
    ['filterDateFrom', 'filterDateTo', 'filterType'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => loadTransactions());
    });

    let searchTimeout;
    document.getElementById('filterSearch').addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => loadTransactions(), 400);
    });

    document.getElementById('clearFilters').addEventListener('click', () => {
        document.getElementById('filterDateFrom').value = '';
        document.getElementById('filterDateTo').value = '';
        document.getElementById('filterType').value = 'all';
        document.getElementById('filterSearch').value = '';
        loadTransactions();
    });

    // Load more
    document.getElementById('loadMoreBtn').addEventListener('click', () => {
        loadTransactions(true);
    });

    // Download statement
    document.getElementById('downloadStatementBtn').addEventListener('click', async () => {
        try {
            toast.info('Generating statement...');
            const response = await api.get(`/accounts/${currentAccountId}/statement`);
            if (response.url) {
                window.open(response.url, '_blank');
            } else {
                toast.success('Statement will be sent to your email');
            }
        } catch (err) {
            toast.error('Failed to generate statement');
        }
    });

    // Handle browser back/forward
    window.addEventListener('popstate', () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (id) {
            showAccountDetail(id);
        } else {
            loadAccountList();
        }
    });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SyncCU - Modern Core Banking Platform. Secure login to manage your credit union operations.">
  <meta name="theme-color" content="#2563eb">
  <title>SyncCU - Sign In</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .login-bg {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 50%, #1e40af 100%);
      padding: 1rem;
      position: relative;
    }
    [data-theme="dark"] .login-bg {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    }
    .login-card {
      background: var(--color-surface);
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
      position: relative;
      z-index: 1;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-brand h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--color-primary);
      letter-spacing: -0.025em;
      margin: 0;
    }
    .login-brand p {
      color: var(--color-text-secondary);
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 0.375rem;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      font-size: 0.9375rem;
      background: var(--color-bg);
      color: var(--color-text);
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .input-wrapper input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .input-wrapper input::placeholder {
      color: var(--color-text-muted);
    }
    .password-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-secondary);
      padding: 0.25rem;
      display: flex;
      align-items: center;
    }
    .password-toggle:hover {
      color: var(--color-text);
    }
    .password-toggle svg {
      width: 1.125rem;
      height: 1.125rem;
    }
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .checkbox-group input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      accent-color: var(--color-primary);
      cursor: pointer;
    }
    .checkbox-group label {
      font-size: 0.8125rem;
      color: var(--color-text-secondary);
      cursor: pointer;
    }
    .forgot-link {
      font-size: 0.8125rem;
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 500;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .btn-login {
      width: 100%;
      padding: 0.8125rem 1rem;
      background: var(--color-primary);
      color: #ffffff;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-login:hover {
      background: var(--color-primary-dark);
    }
    .btn-login:active {
      transform: scale(0.99);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .login-error {
      background: var(--color-danger-bg, #fef2f2);
      color: var(--color-danger, #dc2626);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }
    .login-error.visible {
      display: flex;
    }
    .theme-toggle-corner {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 10;
    }
    .theme-toggle-corner button {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .theme-toggle-corner button:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .theme-toggle-corner svg {
      width: 1.25rem;
      height: 1.25rem;
    }
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }
    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.25rem; }
      .login-brand h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <!-- SVG Sprite -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </symbol>
  </svg>

  <div class="login-bg">
    <div class="theme-toggle-corner">
      <button type="button" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun"><use href="#icon-sun"/></svg>
        <svg class="icon-moon" style="display:none"><use href="#icon-moon"/></svg>
      </button>
    </div>

    <div class="login-card">
      <div class="login-brand">
        <h1>SyncCU</h1>
        <p>Core Banking Platform</p>
      </div>

      <div id="loginError" class="login-error">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span id="loginErrorMsg">Invalid email or password.</span>
      </div>

      <form id="login-form" method="POST" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="email" name="email" placeholder="you@creditunion.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
              <svg class="icon-show"><use href="#icon-eye"/></svg>
              <svg class="icon-hide" style="display:none"><use href="#icon-eye-off"/></svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <div class="checkbox-group">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
          </div>
          <a href="#" class="forgot-link" id="forgotPassword">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
      </form>

      <div class="login-footer">
        &copy; 2026 SyncCU. Secure banking platform.
      </div>
    </div>
  </div>

  <script>
    // Theme toggle
    (function() {
      const toggle = document.getElementById('themeToggle');
      const saved = localStorage.getItem('synccu-theme');
      if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        toggle.querySelector('.icon-sun').style.display = 'none';
        toggle.querySelector('.icon-moon').style.display = '';
      }
      toggle.addEventListener('click', function() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
        localStorage.setItem('synccu-theme', isDark ? 'light' : 'dark');
        toggle.querySelector('.icon-sun').style.display = isDark ? '' : 'none';
        toggle.querySelector('.icon-moon').style.display = isDark ? 'none' : '';
      });
    })();

    // Password visibility toggle
    (function() {
      const toggle = document.getElementById('passwordToggle');
      const input = document.getElementById('password');
      toggle.addEventListener('click', function() {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        toggle.querySelector('.icon-show').style.display = isPassword ? 'none' : '';
        toggle.querySelector('.icon-hide').style.display = isPassword ? '' : 'none';
        toggle.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });
    })();
  </script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

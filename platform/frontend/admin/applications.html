  <div class="main-wrapper">
    <!-- Top Bar -->

      </div>
      <div class="topbar-right">

          <svg class="icon-sun"><use href="#icon-sun"/></svg>

        </button>
        <button class="topbar-btn notification-btn" aria-label="Notifications">
          <svg><use href="#icon-bell"/></svg><span class="badge">3</span>
        </button>
        <div class="user-menu" id="userMenu">

            <div class="dropdown-divider"></div>
            <a href="settings.html" class="dropdown-item"><svg><use href="#icon-settings"/></svg> Settings</a>

    <!-- Page Content -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Applications</h1>
          <p class="page-subtitle">Review and update member loan and service applications.</p>
        </div>
      </div>

      <!-- Status Filter Tabs -->
      <div class="filter-bar">
        <div class="tabs" id="statusTabs">
          <button class="tab-btn active" data-status="">All</button>
          <button class="tab-btn" data-status="pending">Pending</button>
          <button class="tab-btn" data-status="in_review">In Review</button>
          <button class="tab-btn" data-status="approved">Approved</button>
          <button class="tab-btn" data-status="declined">Declined</button>
          <button class="tab-btn" data-status="cancelled">Cancelled</button>
        </div>
      </div>

      <!-- Applications Table -->
      <div class="card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Member</th>
                <th>Type</th>
                <th>Product</th>
                <th>Amount</th>
                <th>Status</th>
                <th style="min-width:340px">Review</th>
              </tr>
            </thead>
            <tbody id="applicationsBody">
              <tr><td colspan="6" style="text-align:center;padding:2rem">Loading applications...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <style>
    .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .tab-btn {
      padding: 0.4rem 0.9rem; border-radius: var(--radius-full, 999px);
      border: 1px solid var(--border-color, #e5e7eb);
      background: var(--card-bg, #fff); color: var(--text-secondary, #374151);
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .tab-btn.active { background: var(--primary, #3b82f6); color: #fff; border-color: transparent; }
    .app-review-controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .app-review-controls .form-select { max-width: 150px; }
    .app-review-controls .form-input { min-width: 140px; flex: 1; }
  </style>

  <script src="../js/admin-common.js"></script>
  <script>
    let currentStatus = '';

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function attrEscape(str) {
      return escapeHtml(str).replace(/"/g, '&quot;');
    }

    function statusBadge(status) {
      const map = {
        pending: 'badge-warning',
        in_review: 'badge-info',
        approved: 'badge-success',
        declined: 'badge-danger',
        cancelled: 'badge-muted'
      };
      const cls = map[status] || 'badge-muted';
      const label = (status || '').replace('_', ' ').replace(/\b\w/g, c => c.toUpperCase()) || 'Unknown';
      return '<span class="badge ' + cls + '">' + escapeHtml(label) + '</span>';
    }

    function statusOptions(current) {
      const opts = ['pending', 'in_review', 'approved', 'declined', 'cancelled'];
      return opts.map(o => '<option value="' + o + '"' + (o === current ? ' selected' : '') + '>' +
        o.replace('_', ' ').replace(/\b\w/g, c => c.toUpperCase()) + '</option>').join('');
    }

    async function loadApplications() {
      const tbody = document.getElementById('applicationsBody');
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem">Loading...</td></tr>';
      try {
        const url = '/api/v1/admin/applications' + (currentStatus ? '?status=' + encodeURIComponent(currentStatus) : '');
        const resp = await apiFetch(url);
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:red">API error ' + resp.status + ': ' + (err.message || err.error || 'Unknown') + '</td></tr>';
          return;
        }
        const json = await resp.json();
        const apps = (json.data && json.data.applications) || [];
        if (!apps.length) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--color-text-muted)">No applications found</td></tr>';
          return;
        }
        tbody.innerHTML = apps.map(a => {
          const amount = a.amount != null && a.amount !== ''
            ? '$' + Number(a.amount).toLocaleString(undefined, { minimumFractionDigits: 2 }) : '-';
          const typeLabel = a.app_type ? a.app_type.charAt(0).toUpperCase() + a.app_type.slice(1) : '-';
          return '<tr>' +
            '<td><div>' + escapeHtml(a.member_name || '-') + '</div><small style="color:var(--color-text-muted)">' + escapeHtml(a.email || '') + '</small></td>' +
            '<td>' + escapeHtml(typeLabel) + '</td>' +
            '<td>' + escapeHtml(a.product || '-') + '</td>' +
            '<td>' + amount + '</td>' +
            '<td>' + statusBadge(a.status) + '</td>' +
            '<td><div class="app-review-controls">' +
              '<select class="form-select" id="status-' + escapeHtml(a.id) + '">' + statusOptions(a.status) + '</select>' +
              '<input type="text" class="form-input" id="notes-' + escapeHtml(a.id) + '" placeholder="Staff notes" value="' + attrEscape(a.staff_notes || '') + '">' +
              '<button class="btn btn-primary btn-sm" onclick="saveApplication(\'' + escapeHtml(a.id) + '\', this)">Save</button>' +
            '</div></td>' +
            '</tr>';
        }).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:red">Failed to load: ' + escapeHtml(e.message) + '</td></tr>';
      }
    }

    async function saveApplication(id, btn) {
      const status = document.getElementById('status-' + id).value;
      const staff_notes = document.getElementById('notes-' + id).value;
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Saving...';
      try {
        const resp = await apiFetch('/api/v1/admin/applications/' + id, {
          method: 'PUT',
          body: JSON.stringify({ status, staff_notes })
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          alert(err.message || err.error || 'Failed to update application');
          return;
        }
        loadApplications();
      } catch (e) {
        alert('Network error: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    }
    window.saveApplication = saveApplication;

    // Status filter tabs
    document.getElementById('statusTabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab-btn');
      if (!tab) return;
      document.querySelectorAll('#statusTabs .tab-btn').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentStatus = tab.getAttribute('data-status') || '';
      loadApplications();
    });

    loadApplications();
  </script>
</body>

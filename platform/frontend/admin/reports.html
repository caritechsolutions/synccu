  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu"><svg><use href="#icon-menu"/></svg></button>
        <div class="search-box">
          <svg class="search-icon"><use href="#icon-search"/></svg>
          <input type="text" placeholder="Search..." aria-label="Search">
        </div>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <svg class="icon-sun"><use href="#icon-sun"/></svg>
          <svg class="icon-moon" style="display:none"><use href="#icon-moon"/></svg>
        </button>
        <button class="topbar-btn notification-btn" aria-label="Notifications">
          <svg><use href="#icon-bell"/></svg><span class="badge">3</span>
        </button>
        <div class="user-menu" id="userMenu">
          <button class="user-avatar-btn" id="userAvatarBtn">
            <div class="avatar">AD</div>
            <svg class="chevron"><use href="#icon-chevron-down"/></svg>
          </button>
          <div class="user-dropdown" id="userDropdown">
            <div class="dropdown-header"><strong>Admin User</strong><span>admin@synccu.com</span></div>
            <div class="dropdown-divider"></div>
            <a href="settings.html" class="dropdown-item"><svg><use href="#icon-settings"/></svg> Settings</a>
            <a href="#" class="dropdown-item" id="logoutBtn2"><svg><use href="#icon-logout"/></svg> Logout</a>
          </div>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Reports</h1>
          <p class="page-subtitle">Generate and view financial reports for the credit union.</p>
        </div>
      </div>

      <!-- Report Type Cards -->
      <div class="report-cards">
        <button class="report-card active" data-report="income-statement">
          <div class="report-card-icon"><svg><use href="#icon-dollar"/></svg></div>
          <h4>Income Statement</h4>
          <p>Revenue, expenses, and net income</p>
        </button>
        <button class="report-card" data-report="balance-sheet">
          <div class="report-card-icon"><svg><use href="#icon-chart"/></svg></div>
          <h4>Balance Sheet</h4>
          <p>Assets, liabilities, and equity</p>
        </button>
        <button class="report-card" data-report="general-ledger">
          <div class="report-card-icon"><svg><use href="#icon-send"/></svg></div>
          <h4>General Ledger</h4>
          <p>All transactions as debit/credit entries</p>
        </button>
        <button class="report-card" data-report="transactions">
          <div class="report-card-icon"><svg><use href="#icon-credit-card"/></svg></div>
          <h4>Transaction Report</h4>
          <p>Transaction volume by type</p>
        </button>
        <button class="report-card" data-report="loan-portfolio">
          <div class="report-card-icon"><svg><use href="#icon-wallet"/></svg></div>
          <h4>Loan Portfolio</h4>
          <p>Loan performance by status</p>
        </button>
        <button class="report-card" data-report="delinquency">
          <div class="report-card-icon"><svg><use href="#icon-calendar"/></svg></div>
          <h4>Delinquency</h4>
          <p>Overdue loans and days past due</p>
        </button>
        <button class="report-card" data-report="member-growth">
          <div class="report-card-icon"><svg><use href="#icon-users"/></svg></div>
          <h4>Member Growth</h4>
          <p>Membership and account trends</p>
        </button>
      </div>

      <!-- Date Range & Actions -->
      <div class="card" style="margin-top:1.5rem;padding:1rem">
        <div style="display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-end">
          <div class="form-group" style="margin:0">
            <label for="reportDateFrom" style="font-size:.75rem">From</label>
            <input type="date" id="reportDateFrom" class="form-input">
          </div>
          <div class="form-group" style="margin:0">
            <label for="reportDateTo" style="font-size:.75rem">To</label>
            <input type="date" id="reportDateTo" class="form-input">
          </div>
          <button class="btn btn-primary" id="generateReportBtn">Generate Report</button>
          <div style="flex:1"></div>
          <button class="btn btn-secondary" id="printReportBtn">
            <svg><use href="#icon-printer"/></svg> Print
          </button>
          <button class="btn btn-secondary" id="exportReportBtn">
            <svg><use href="#icon-download"/></svg> Export CSV
          </button>
        </div>
      </div>

      <!-- Report Display Area -->
      <div class="card" id="reportArea" style="margin-top:1rem">
        <div style="padding:1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
          <h3 id="reportTitle" style="margin:0">Income Statement</h3>
          <span class="text-muted" id="reportDateRange"></span>
        </div>
        <div id="reportContent" style="padding:1.5rem">
          <p style="text-align:center;color:var(--text-muted);padding:2rem 0">Click "Generate Report" to load data.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/admin-common.js"></script>
  <script>
    // === STATE ===
    let currentReport = 'income-statement';

    // Set default dates: first of month to today
    (function() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      document.getElementById('reportDateFrom').value = y + '-' + m + '-01';
      document.getElementById('reportDateTo').value = now.toISOString().slice(0, 10);
    })();

    function fmt(n) { return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2 }); }

    // === REPORT CARD SELECTION ===
    document.querySelectorAll('.report-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.report-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        currentReport = card.dataset.report;
        document.getElementById('reportTitle').textContent = card.querySelector('h4').textContent;
        document.getElementById('reportContent').innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem 0">Click "Generate Report" to load data.</p>';
      });
    });

    // === GENERATE ===
    document.getElementById('generateReportBtn').addEventListener('click', generateReport);

    async function generateReport() {
      const from = document.getElementById('reportDateFrom').value;
      const to = document.getElementById('reportDateTo').value;
      const el = document.getElementById('reportContent');
      el.innerHTML = '<p style="text-align:center;padding:2rem">Loading...</p>';

      const fromLabel = new Date(from + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
      const toLabel = new Date(to + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      document.getElementById('reportDateRange').textContent = fromLabel + ' - ' + toLabel;

      try {
        switch (currentReport) {
          case 'income-statement': await renderIncomeStatement(from, to); break;
          case 'balance-sheet':    await renderBalanceSheet(); break;
          case 'general-ledger':   await renderGeneralLedger(from, to); break;
          case 'transactions':     await renderTransactions(from, to); break;
          case 'loan-portfolio':   await renderLoanPortfolio(); break;
          case 'delinquency':      await renderDelinquency(); break;
          case 'member-growth':      await renderMemberGrowth(from, to); break;
          default: el.innerHTML = '<p style="text-align:center;padding:2rem">Unknown report type.</p>';
        }
      } catch (e) {
        el.innerHTML = '<p style="text-align:center;padding:2rem;color:#dc2626">Error loading report: ' + e.message + '</p>';
      }
    }

    // === INCOME STATEMENT ===
    async function renderIncomeStatement(from, to) {
      const resp = await apiFetch('/api/v1/reports/income-statement?from=' + from + '&to=' + to);
      const json = await resp.json();
      if (!resp.ok) throw new Error(json.message || 'Failed');
      const d = json.data;
      const el = document.getElementById('reportContent');

      let html = `
        <div class="report-summary-grid">
          <div class="report-summary-card report-summary-green">
            <span class="report-summary-label">Total Revenue</span>
            <span class="report-summary-value">${fmt(d.total_revenue)}</span>
          </div>
          <div class="report-summary-card report-summary-red">
            <span class="report-summary-label">Total Expenses</span>
            <span class="report-summary-value">${fmt(d.total_expenses)}</span>
          </div>
          <div class="report-summary-card ${d.net_income >= 0 ? 'report-summary-blue' : 'report-summary-red'}">
            <span class="report-summary-label">Net Income</span>
            <span class="report-summary-value">${fmt(d.net_income)}</span>
            <span class="report-summary-sub">${d.total_revenue > 0 ? 'Margin: ' + ((d.net_income / d.total_revenue) * 100).toFixed(1) + '%' : ''}</span>
          </div>
        </div>
        <div class="table-responsive" style="margin-top:1.5rem">
          <table class="data-table">
            <thead><tr><th>Category</th><th style="text-align:right">Amount</th></tr></thead>
            <tbody>
              <tr><td colspan="2"><strong>Revenue</strong></td></tr>`;
      (d.revenue || []).forEach(r => {
        html += `<tr><td style="padding-left:2rem">${r.name}</td><td style="text-align:right">${fmt(r.amount)}</td></tr>`;
      });
      if (!(d.revenue || []).length) html += '<tr><td colspan="2" style="padding-left:2rem;color:var(--text-muted)">No revenue recorded</td></tr>';
      html += `<tr style="border-top:2px solid var(--border)"><td><strong>Total Revenue</strong></td><td style="text-align:right"><strong>${fmt(d.total_revenue)}</strong></td></tr>
              <tr><td colspan="2"><strong>Expenses</strong></td></tr>`;
      (d.expenses || []).forEach(r => {
        html += `<tr><td style="padding-left:2rem">${r.name}</td><td style="text-align:right">${fmt(r.amount)}</td></tr>`;
      });
      if (!(d.expenses || []).length) html += '<tr><td colspan="2" style="padding-left:2rem;color:var(--text-muted)">No expenses recorded</td></tr>';
      html += `<tr style="border-top:2px solid var(--border)"><td><strong>Total Expenses</strong></td><td style="text-align:right"><strong>${fmt(d.total_expenses)}</strong></td></tr>
              <tr style="border-top:3px double var(--border)"><td><strong>Net Income</strong></td><td style="text-align:right"><strong>${fmt(d.net_income)}</strong></td></tr>
            </tbody></table></div>`;
      el.innerHTML = html;
    }

    // === BALANCE SHEET ===
    async function renderBalanceSheet() {
      const resp = await apiFetch('/api/v1/reports/balance-sheet');
      const json = await resp.json();
      if (!resp.ok) throw new Error(json.message || 'Failed');
      const d = json.data;
      const el = document.getElementById('reportContent');

      let html = `
        <div class="report-summary-grid">
          <div class="report-summary-card report-summary-blue">
            <span class="report-summary-label">Total Assets</span>
            <span class="report-summary-value">${fmt(d.total_assets)}</span>
          </div>
          <div class="report-summary-card report-summary-red">
            <span class="report-summary-label">Total Liabilities</span>
            <span class="report-summary-value">${fmt(d.total_liabilities)}</span>
          </div>
          <div class="report-summary-card report-summary-green">
            <span class="report-summary-label">Equity</span>
            <span class="report-summary-value">${fmt(d.total_equity)}</span>
            <span class="report-summary-sub">${d.balanced ? 'Balanced' : 'NOT BALANCED'}</span>
          </div>
        </div>
        <div class="table-responsive" style="margin-top:1.5rem">
          <table class="data-table">
            <thead><tr><th>Category</th><th style="text-align:right">Balance</th></tr></thead>
            <tbody>
              <tr><td colspan="2"><strong>Assets</strong></td></tr>`;
      (d.assets || []).forEach(a => {
        html += `<tr><td style="padding-left:2rem">${a.name}</td><td style="text-align:right">${fmt(a.balance)}</td></tr>`;
      });
      html += `<tr style="border-top:2px solid var(--border)"><td><strong>Total Assets</strong></td><td style="text-align:right"><strong>${fmt(d.total_assets)}</strong></td></tr>
              <tr><td colspan="2"><strong>Liabilities</strong></td></tr>`;
      (d.liabilities || []).forEach(a => {
        html += `<tr><td style="padding-left:2rem">${a.name}</td><td style="text-align:right">${fmt(a.balance)}</td></tr>`;
      });
      html += `<tr style="border-top:2px solid var(--border)"><td><strong>Total Liabilities</strong></td><td style="text-align:right"><strong>${fmt(d.total_liabilities)}</strong></td></tr>
              <tr><td colspan="2"><strong>Equity</strong></td></tr>`;
      (d.equity || []).forEach(a => {
        html += `<tr><td style="padding-left:2rem">${a.name}</td><td style="text-align:right">${fmt(a.balance)}</td></tr>`;
      });
      html += `<tr style="border-top:2px solid var(--border)"><td><strong>Total Equity</strong></td><td style="text-align:right"><strong>${fmt(d.total_equity)}</strong></td></tr>
              <tr style="border-top:3px double var(--border)"><td><strong>Liabilities + Equity</strong></td><td style="text-align:right"><strong>${fmt(d.total_liabilities + d.total_equity)}</strong></td></tr>
            </tbody></table></div>`;
      el.innerHTML = html;
    }

    // === GENERAL LEDGER ===
    let glPage = 1;
    async function renderGeneralLedger(from, to, page) {
      page = page || 1;
      glPage = page;
      const resp = await apiFetch('/api/v1/reports/general-ledger?from=' + from + '&to=' + to + '&page=' + page + '&per_page=25');
      const json = await resp.json();
      if (!resp.ok) throw new Error(json.message || 'Failed');
      const entries = json.data || [];
      const meta = json.meta || {};
      const el = document.getElementById('reportContent');

      if (!entries.length) { el.innerHTML = '<p style="text-align:center;padding:2rem;color:var(--text-muted)">No ledger entries found for this period.</p>'; return; }

      let html = '<div class="table-responsive"><table class="data-table"><thead><tr><th>Date</th><th>Reference</th><th>Description</th><th>Account</th><th style="text-align:right">Debit</th><th style="text-align:right">Credit</th></tr></thead><tbody>';
      entries.forEach(e => {
        const date = e.created_at ? new Date(e.created_at).toLocaleDateString() : '-';
        const lines = e.lines || [];
        const typeLabel = (e.type || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        lines.forEach((ln, i) => {
          html += '<tr>';
          if (i === 0) {
            html += `<td rowspan="${lines.length}">${date}</td><td rowspan="${lines.length}" class="font-mono" style="font-size:.75rem">${e.reference_number || '-'}</td><td rowspan="${lines.length}">${e.description || typeLabel}</td>`;
          }
          html += `<td>${ln.account || '-'}</td>
            <td style="text-align:right">${Number(ln.debit) > 0 ? fmt(ln.debit) : ''}</td>
            <td style="text-align:right">${Number(ln.credit) > 0 ? fmt(ln.credit) : ''}</td></tr>`;
        });
        html += '<tr><td colspan="6" style="padding:0;border:none;height:4px;background:var(--bg-muted)"></td></tr>';
      });
      html += '</tbody></table></div>';

      if (meta.total) {
        const totalPages = meta.total_pages || Math.ceil(meta.total / meta.per_page);
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:1rem 0">';
        html += '<span>Showing page ' + meta.page + ' of ' + totalPages + ' (' + meta.total + ' entries)</span>';
        html += '<div style="display:flex;gap:.25rem">';
        if (page > 1) html += '<button class="btn btn-secondary btn-sm" onclick="renderGeneralLedger(\'' + from + '\',\'' + to + '\',' + (page - 1) + ')">Previous</button>';
        if (page < totalPages) html += '<button class="btn btn-secondary btn-sm" onclick="renderGeneralLedger(\'' + from + '\',\'' + to + '\',' + (page + 1) + ')">Next</button>';
        html += '</div></div>';
      }
      el.innerHTML = html;
    }

    // === TRANSACTIONS ===
    async function renderTransactions(from, to) {
      const resp = await apiFetch('/api/v1/admin/reports?type=transactions&from=' + from + '&to=' + to);
      const json = await resp.json();
      if (!resp.ok) throw new Error(json.message || 'Failed');
      const report = (json.data && json.data.report) || [];
      const el = document.getElementById('reportContent');
      if (!report.length) { el.innerHTML = '<p style="text-align:center;padding:2rem;color:var(--text-muted)">No transactions found for this period.</p>'; return; }

      const totalCount = report.reduce((s, r) => s + Number(r.count), 0);
      const totalAmount = report.reduce((s, r) => s + Number(r.total_amount), 0);

      let html = `<div class="report-summary-grid">
        <div class="report-summary-card report-summary-blue">
          <span class="report-summary-label">Total Transactions</span>
          <span class="report-summary-value">${totalCount}</span>
        </div>
        <div class="report-summary-card report-summary-green">
          <span class="report-summary-label">Total Volume</span>
          <span class="report-summary-value">${fmt(totalAmount)}</span>
        </div>
      </div>
      <div class="table-responsive" style="margin-top:1.5rem">
        <table class="data-table">
          <thead><tr><th>Transaction Type</th><th style="text-align:right">Count</th><th style="text-align:right">Total Amount</th><th style="text-align:right">% of Volume</th></tr></thead>
          <tbody>`;
      report.forEach(r => {
        const pct = totalAmount > 0 ? ((Number(r.total_amount) / totalAmount) * 100).toFixed(1) : '0.0';
        html += `<tr><td>${r.type.replace('_', ' ').replace(/\b\w/g, c => c.toUpperCase())}</td><td style="text-align:right">${r.count}</td><td style="text-align:right">${fmt(r.total_amount)}</td><td style="text-align:right">${pct}%</td></tr>`;
      });
      html += `<tr style="border-top:3px double var(--border);font-weight:700"><td>Total</td><td style="text-align:right">${totalCount}</td><td style="text-align:right">${fmt(totalAmount)}</td><td style="text-align:right">100%</td></tr></tbody></table></div>`;
      el.innerHTML = html;
    }

    // === LOAN PORTFOLIO ===
    async function renderLoanPortfolio() {
      const resp = await apiFetch('/api/v1/admin/reports?type=loans');
      const json = await resp.json();
      if (!resp.ok) throw new Error(json.message || 'Failed');
      const report = (json.data && json.data.report) || [];
      const el = document.getElementById('reportContent');

      const totalCount = report.reduce((s, r) => s + Number(r.count), 0);
      const totalOriginal = report.reduce((s, r) => s + Number(r.total_amount), 0);
      const totalOutstanding = report.reduce((s, r) => s + Number(r.total_remaining), 0);

      let html = `<div class="report-summary-grid">
        <div class="report-summary-card report-summary-blue">
          <span class="report-summary-label">Total Loans</span>
          <span class="report-summary-value">${totalCount}</span>
        </div>
        <div class="report-summary-card report-summary-green">
          <span class="report-summary-label">Total Originated</span>
          <span class="report-summary-value">${fmt(totalOriginal)}</span>
        </div>
        <div class="report-summary-card report-summary-red">
          <span class="report-summary-label">Outstanding Balance</span>
          <span class="report-summary-value">${fmt(totalOutstanding)}</span>
        </div>
      </div>
      <div class="table-responsive" style="margin-top:1.5rem">
        <table class="data-table">
          <thead><tr><th>Status</th><th style="text-align:right">Count</th><th style="text-align:right">Originated</th><th style="text-align:right">Outstanding</th></tr></thead>
          <tbody>`;
      const statusClasses = { application:'badge-warning', approved:'badge-info', active:'badge-success', delinquent:'badge-danger', default:'badge-danger', paid_off:'badge-muted', cancelled:'badge-muted', denied:'badge-danger' };
      report.forEach(r => {
        const label = r.status.replace('_', ' ').replace(/\b\w/g, c => c.toUpperCase());
        html += `<tr><td><span class="badge ${statusClasses[r.status] || 'badge-muted'}">${label}</span></td><td style="text-align:right">${r.count}</td><td style="text-align:right">${fmt(r.total_amount)}</td><td style="text-align:right">${fmt(r.total_remaining)}</td></tr>`;
      });
      html += `<tr style="border-top:3px double var(--border);font-weight:700"><td>Total</td><td style="text-align:right">${totalCount}</td><td style="text-align:right">${fmt(totalOriginal)}</td><td style="text-align:right">${fmt(totalOutstanding)}</td></tr></tbody></table></div>`;
      el.innerHTML = html;
    }

    // === DELINQUENCY ===
    async function renderDelinquency() {
      const resp = await apiFetch('/api/v1/reports/delinquency');
      const json = await resp.json();
      if (!resp.ok) throw new Error(json.message || 'Failed');
      const d = json.data;
      const loans = d.loans || [];
      const el = document.getElementById('reportContent');

      let html = `<div class="report-summary-grid">
        <div class="report-summary-card report-summary-red">
          <span class="report-summary-label">Delinquent Loans</span>
          <span class="report-summary-value">${d.total_count || 0}</span>
        </div>
        <div class="report-summary-card report-summary-red">
          <span class="report-summary-label">Total Overdue Balance</span>
          <span class="report-summary-value">${fmt(d.total_overdue_balance)}</span>
        </div>
      </div>`;

      if (!loans.length) {
        html += '<p style="text-align:center;padding:2rem;color:#16a34a;font-weight:600">No delinquent loans found.</p>';
      } else {
        html += `<div class="table-responsive" style="margin-top:1.5rem">
          <table class="data-table">
            <thead><tr><th>Loan #</th><th>Member</th><th>Type</th><th style="text-align:right">Outstanding</th><th style="text-align:right">Monthly Pmt</th><th>Next Due</th><th style="text-align:right;color:#dc2626">Days Past Due</th></tr></thead>
            <tbody>`;
        loans.forEach(l => {
          const severity = l.days_past_due > 90 ? '#dc2626' : l.days_past_due > 30 ? '#ea580c' : '#ca8a04';
          html += `<tr><td class="font-mono">${l.loan_number || '-'}</td><td>${l.member_name || '-'}</td><td>${l.loan_type}</td><td style="text-align:right">${fmt(l.outstanding_balance)}</td><td style="text-align:right">${fmt(l.monthly_payment)}</td><td>${l.next_payment_date || '-'}</td><td style="text-align:right;font-weight:700;color:${severity}">${l.days_past_due}</td></tr>`;
        });
        html += '</tbody></table></div>';
      }
      el.innerHTML = html;
    }

    // === MEMBER GROWTH ===
    async function renderMemberGrowth(from, to) {
      const resp = await apiFetch('/api/v1/reports/member-growth?from=' + from + '&to=' + to);
      const json = await resp.json();
      if (!resp.ok) throw new Error(json.message || 'Failed');
      const d = json.data;
      const el = document.getElementById('reportContent');

      let html = `<div class="report-summary-grid">
        <div class="report-summary-card report-summary-blue">
          <span class="report-summary-label">Total Members</span>
          <span class="report-summary-value">${d.total_members || 0}</span>
        </div>
        <div class="report-summary-card report-summary-green">
          <span class="report-summary-label">Total Accounts</span>
          <span class="report-summary-value">${d.total_accounts || 0}</span>
        </div>
      </div>`;

      const members = d.member_trend || [];
      if (members.length) {
        html += `<h4 style="margin:1.5rem 0 .75rem">New Members by Month</h4>
          <div class="table-responsive"><table class="data-table">
            <thead><tr><th>Month</th><th style="text-align:right">New Members</th></tr></thead><tbody>`;
        members.forEach(m => {
          html += `<tr><td>${m.month}</td><td style="text-align:right">${m.new_members}</td></tr>`;
        });
        html += '</tbody></table></div>';
      }

      const accounts = d.account_trend || [];
      if (accounts.length) {
        html += `<h4 style="margin:1.5rem 0 .75rem">New Accounts by Month &amp; Type</h4>
          <div class="table-responsive"><table class="data-table">
            <thead><tr><th>Month</th><th>Account Type</th><th style="text-align:right">New Accounts</th></tr></thead><tbody>`;
        accounts.forEach(a => {
          html += `<tr><td>${a.month}</td><td>${a.account_type}</td><td style="text-align:right">${a.new_accounts}</td></tr>`;
        });
        html += '</tbody></table></div>';
      }

      if (!members.length && !accounts.length) {
        html += '<p style="text-align:center;padding:2rem;color:var(--text-muted)">No growth data for this period.</p>';
      }
      el.innerHTML = html;
    }

    // === PRINT ===
    document.getElementById('printReportBtn').addEventListener('click', () => window.print());

    // === EXPORT CSV ===
    document.getElementById('exportReportBtn').addEventListener('click', async () => {
      const from = document.getElementById('reportDateFrom').value;
      const to = document.getElementById('reportDateTo').value;
      try {
        const resp = await apiFetch('/api/v1/reports/export?type=' + currentReport + '&from=' + from + '&to=' + to);
        if (!resp.ok) { alert('Export failed'); return; }
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = currentReport + '-report-' + new Date().toISOString().slice(0, 10) + '.csv';
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      } catch (e) { alert('Export error: ' + e.message); }
    });
  </script>
</body>
</html>

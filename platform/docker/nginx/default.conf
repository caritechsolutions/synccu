# ──────────────────────────────────────────────────────────────
# SyncCU Platform - Nginx Configuration
# Core Banking Platform
# ──────────────────────────────────────────────────────────────

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

# Upstream definitions
upstream php_backend {
    server php:9000;
}

upstream python_api {
    server api:8000;
}

server {
    listen 80;
    server_name ${DOMAIN:-localhost};

    root /var/www/synccu/frontend;
    index index.html;

    # Hide server version
    server_tokens off;

    # File upload size limit
    client_max_body_size 10M;

    # ──────────────────────────────────────────────
    # Security Headers
    # ──────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ──────────────────────────────────────────────
    # Gzip Compression
    # ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # ──────────────────────────────────────────────
    # Frontend - Static Files
    # ──────────────────────────────────────────────
    location / {
        limit_req zone=general_limit burst=40 nodelay;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Static assets with long cache
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ──────────────────────────────────────────────
    # PHP API v1 - FastCGI
    # ──────────────────────────────────────────────
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;

        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/synccu/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param HTTPS $https if_not_empty;
        include fastcgi_params;

        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # PHP API v1 login - stricter rate limit
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        fastcgi_pass php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/synccu/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    # ──────────────────────────────────────────────
    # Python API v2 - Reverse Proxy
    # ──────────────────────────────────────────────
    location /api/v2/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://python_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        proxy_read_timeout 300;
        proxy_connect_timeout 30;
        proxy_send_timeout 300;

        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # Python API v2 login - stricter rate limit
    location = /api/v2/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://python_api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ──────────────────────────────────────────────
    # Health Check Endpoint
    # ──────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ──────────────────────────────────────────────
    # Deny Access to Sensitive Files
    # ──────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|sql|log|sh|yml|yaml|toml|ini|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ──────────────────────────────────────────────
    # Logging
    # ──────────────────────────────────────────────
    access_log /var/log/nginx/synccu-access.log;
    error_log /var/log/nginx/synccu-error.log;
}
